<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blooms&Twirl by Shaira | Customer & Client Portal</title>
  <meta name="description" content="Customer portal for Blooms&Twirl by Shaira - Track your flower delivery, manage orders, and book private bridal consultations in Northern Luzon.">
  
  <!-- Google Fonts: Fraunces & Plus Jakarta Sans with display=block to eliminate Times New Roman FOUT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=block">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=block" rel="stylesheet">
  
  <link rel="stylesheet" href="../src/styles/main.css">
  
  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      background: var(--bg-page);
      font-family: var(--font-sans);
    }
    .order-tracker-stepper {
      display: flex;
      justify-content: space-between;
      position: relative;
      margin: 32px 0 24px;
    }
    .order-tracker-stepper::before {
      content: '';
      position: absolute;
      top: 18px;
      left: 30px;
      right: 30px;
      height: 3px;
      background: var(--border-light);
      z-index: 1;
    }
    .stepper-step {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .step-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 3px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      color: var(--text-muted);
      transition: all 0.25s ease;
    }
    .stepper-step.completed .step-circle {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
    }
    .stepper-step.active .step-circle {
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-subtle);
    }
    .step-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .stepper-step.completed .step-label,
    .stepper-step.active .step-label {
      color: var(--text-main);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="root">
    <!-- Initial Loading indicator: styled so it NEVER flashes Times New Roman -->
    <div id="loading-splash" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif; background:#FFF5F8;">
      <div style="width:62px; height:62px; border-radius:18px; background:#FFE0EB; border:1px solid #FFC2D6; display:flex; align-items:center; justify-content:center; color:#F70077; margin-bottom:20px; box-shadow:0 8px 24px rgba(247,0,119,0.16); animation:pulse 1.8s infinite ease-in-out;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#F70077" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 7.5a4.5 4.5 0 1 1 4.5 4.5M12 7.5A4.5 4.5 0 1 0 7.5 12M12 7.5V3m4.5 9a4.5 4.5 0 1 1-4.5 4.5M16.5 12H21m-9 4.5a4.5 4.5 0 1 1-4.5-4.5M12 16.5V21m-4.5-9H3"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </div>
      <div id="loading-brand-title" style="font-family:'Fraunces', 'Plus Jakarta Sans', -apple-system, sans-serif; font-size:32px; font-weight:700; color:#1C1917; margin-bottom:6px; letter-spacing:-0.5px; opacity:0; transition:opacity 0.3s ease;">
        Blooms<span style="color:#F70077;">&</span>Twirl
      </div>
      <div style="font-size:11px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; color:#826F76; margin-bottom:16px;">
        CLIENT & CUSTOMER CARE PORTAL
      </div>
      <div style="display:flex; align-items:center; gap:8px; font-size:13px; color:#A8929A;">
        <span style="display:inline-block; width:12px; height:12px; border:2px solid #F70077; border-top-color:transparent; border-radius:50%; animation:spin 0.8s linear infinite;"></span>
        <span>Loading Client Care Portal...</span>
      </div>
    </div>
  </div>

  <script>
    (function() {
      function showBrandTitle() {
        var el = document.getElementById('loading-brand-title');
        if (el) el.style.opacity = '1';
      }
      if (document.fonts && document.fonts.load) {
        document.fonts.load('700 32px Fraunces').then(showBrandTitle).catch(function() {
          showBrandTitle();
        });
      } else {
        window.addEventListener('load', showBrandTitle);
      }
    })();
  </script>

  <script type="text/babel">
const { useState, useEffect } = React;

const IconsBase = {
  Flower: () => (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M12 7.5a4.5 4.5 0 1 1 4.5 4.5M12 7.5A4.5 4.5 0 1 0 7.5 12M12 7.5V3m4.5 9a4.5 4.5 0 1 1-4.5 4.5M16.5 12H21m-9 4.5a4.5 4.5 0 1 1-4.5-4.5M12 16.5V21m-4.5-9H3"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
  ),
  ShoppingBag: () => (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>
    </svg>
  ),
  User: () => (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
    </svg>
  ),
  Truck: () => (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-5l-4-4h-3v10Z"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>
    </svg>
  ),
  Calendar: () => (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/>
    </svg>
  ),
  Clock: () => (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
    </svg>
  ),
  Home: () => (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
  ),
  Sparkles: () => (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>
    </svg>
  ),
  ArrowUpRight: () => (
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
      <path d="M7 17L17 7"/><path d="M7 7h10v10"/>
    </svg>
  )
};

const Icons = new Proxy(IconsBase, {
  get: (target, prop) => {
    if (prop in target) return target[prop];
    return (props) => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>
        <circle cx="12" cy="12" r="8"/>
      </svg>
    );
  }
});

function CustomerApp() {
  const [activeTab, setActiveTab] = useState('tracking');
  const [lookupOrderNumber, setLookupOrderNumber] = useState('BT-2041');
  const [isOwnerModalOpen, setIsOwnerModalOpen] = useState(false);

  const sampleOrders = [
    { id: 'BT-2041', customerName: 'Marisol Reyes', arrangementName: 'Petal Parade bridal bouquet', address: 'Luna, Apayao', total: 8450, status: 'Arranging', dueTime: '12:30 PM', courier: 'Jom (Studio Courier)', cardMessage: 'Happy wedding day to the sweetest bride!' },
    { id: 'BT-2040', customerName: 'Kaito Nakamura', arrangementName: 'Fuchsia Fable hand-tied + vase ×2', address: 'Urbiztondo, San Juan, La Union', total: 4180, status: 'Fresh', dueTime: '2:00 PM', courier: 'Nino', cardMessage: 'Happy anniversary, my love!' },
    { id: 'BT-2039', customerName: 'Highland Pine Cafe', arrangementName: 'Table blooms × 6', address: 'Camp 7, Baguio City', total: 12600, status: 'In transit', dueTime: '10:00 AM', courier: 'Marisol', cardMessage: 'Weekly floral decor for cafe tables.' },
    { id: 'BT-2038', customerName: 'Andrea Villanueva', arrangementName: 'Dusk & Dried bespoke', address: 'Strawberry Valley, La Trinidad', total: 2740, status: 'Delivered', dueTime: '5:30 PM', courier: 'Nino', cardMessage: 'Thinking of you always.' }
  ];

  const [trackedOrder, setTrackedOrder] = useState(sampleOrders[0]);

  return (
    <div style={{ minHeight: '100vh', background: 'var(--bg-page)' }}>
      {/* Announcement Bar */}
      <div style={{ background: '#2E121E', color: '#FCE2E8', textAlign: 'center', padding: '9px 16px', fontSize: '13px', fontWeight: '600' }}>
        Client Care Portal · Blooms&Twirl by Shaira · Atelier in Apayao · Flower Supply from Baguio City
      </div>

      {/* Portal Header */}
      <header style={{ background: '#FFFFFF', borderBottom: '1px solid var(--border-light)', padding: '18px 48px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', position: 'sticky', top: 0, zIndex: 90 }}>
        <a href="../index.html" style={{ display: 'flex', alignItems: 'center', gap: '12px', textDecoration: 'none', color: 'inherit' }}>
          <div className="brand-icon-box">
            <Icons.Flower />
          </div>
          <div>
            <h1 style={{ fontFamily: 'var(--font-serif)', fontSize: '24px', fontWeight: '700', lineHeight: '1.1', margin: 0 }}>
              Blooms<span style={{ color: 'var(--primary)' }}>&</span>Twirl
            </h1>
            <div style={{ fontSize: '11px', fontWeight: '700', letterSpacing: '1.2px', textTransform: 'uppercase', color: 'var(--text-muted)' }}>
              CLIENT CARE & DISPATCH PORTAL
            </div>
          </div>
        </a>

        <div style={{ display: 'flex', alignItems: 'center', gap: '14px' }}>
          <button 
            className="btn-secondary" 
            style={{ display: 'flex', alignItems: 'center', gap: '6px', borderColor: 'var(--primary-border)', color: 'var(--primary)', fontWeight: '700' }}
            onClick={() => setIsOwnerModalOpen(true)}
          >
            <Icons.User /> Owner Profile
          </button>
          <a href="../index.html" className="btn-primary" style={{ textDecoration: 'none', display: 'flex', alignItems: 'center', gap: '8px' }}>
            <Icons.ShoppingBag /> Visit Studio Store
          </a>
        </div>
      </header>

      {/* Main Container */}
      <main className="page-content" style={{ maxWidth: '960px', margin: '36px auto' }}>
        {/* Navigation Tabs */}
        <div style={{ display: 'flex', gap: '10px', marginBottom: '28px', borderBottom: '1px solid var(--border-light)', paddingBottom: '14px' }}>
          <button 
            className={'switcher-btn ' + (activeTab === 'tracking' ? 'active' : '')} 
            style={{ padding: '8px 20px', fontSize: '14px', display: 'inline-flex', alignItems: 'center', gap: '8px' }}
            onClick={() => setActiveTab('tracking')}
          >
            <Icons.Truck /> Live Order Tracking
          </button>
          <button 
            className={'switcher-btn ' + (activeTab === 'history' ? 'active' : '')} 
            style={{ padding: '8px 20px', fontSize: '14px', display: 'inline-flex', alignItems: 'center', gap: '8px' }}
            onClick={() => setActiveTab('history')}
          >
            <Icons.Clock /> Order History
          </button>
          <button 
            className={'switcher-btn ' + (activeTab === 'consult' ? 'active' : '')} 
            style={{ padding: '8px 20px', fontSize: '14px', display: 'inline-flex', alignItems: 'center', gap: '8px' }}
            onClick={() => setActiveTab('consult')}
          >
            <Icons.Calendar /> Wedding & Consultations
          </button>
        </div>

        {/* TAB 1: LIVE ORDER TRACKING */}
        {activeTab === 'tracking' && (
          <div>
            <div className="page-eyebrow">NORTHERN LUZON DISPATCH</div>
            <h2 className="page-title" style={{ marginBottom: '8px' }}>Follow Your Floral Arrangement</h2>
            <p className="page-description" style={{ marginBottom: '24px' }}>
              Real-time dispatch updates from Shaira's atelier bench in Luna, Apayao to your destination.
            </p>

            <div style={{ display: 'flex', gap: '12px', marginBottom: '32px' }}>
              <input 
                type="text" 
                className="form-control" 
                placeholder="Enter Order Number (e.g. BT-2041)"
                value={lookupOrderNumber}
                onChange={(e) => setLookupOrderNumber(e.target.value)}
              />
              <button className="btn-primary" onClick={() => {
                const found = sampleOrders.find(o => o.id.toUpperCase() === lookupOrderNumber.trim().toUpperCase());
                if (found) {
                  setTrackedOrder(found);
                } else {
                  alert('Order ' + lookupOrderNumber + ' not found. Try BT-2041, BT-2040, BT-2039, or BT-2038.');
                }
              }}>
                Track Order
              </button>
            </div>

            {trackedOrder && (
              <div className="content-card" style={{ padding: '36px' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', borderBottom: '1px solid var(--border-light)', paddingBottom: '20px' }}>
                  <div>
                    <span className="card-subtitle">ORDER DETAILS</span>
                    <h3 style={{ fontFamily: 'var(--font-serif)', fontSize: '26px', margin: '4px 0' }}>
                      {trackedOrder.id} · {trackedOrder.customerName}
                    </h3>
                    <div style={{ fontSize: '14px', color: 'var(--text-main)', marginTop: '4px' }}>
                      Arrangement: <strong>{trackedOrder.arrangementName}</strong>
                    </div>
                    <div style={{ fontSize: '13px', color: 'var(--text-muted)', marginTop: '2px' }}>
                      Destination: <strong>{trackedOrder.address}</strong>
                    </div>
                  </div>
                  <div style={{ textAlign: 'right' }}>
                    <div style={{ fontSize: '13px', color: 'var(--text-muted)' }}>Amount Paid</div>
                    <div style={{ fontFamily: 'var(--font-serif)', fontSize: '24px', fontWeight: '700', color: 'var(--primary)' }}>
                      ₱{trackedOrder.total.toLocaleString()}
                    </div>
                  </div>
                </div>

                {/* 4-Step Progress Stepper */}
                <div className="order-tracker-stepper">
                  <div className={'stepper-step ' + (['Fresh', 'Arranging', 'In transit', 'Delivered'].includes(trackedOrder.status) ? 'completed' : '')}>
                    <div className="step-circle">1</div>
                    <span className="step-label">Order Received</span>
                  </div>

                  <div className={'stepper-step ' + (['Arranging', 'In transit', 'Delivered'].includes(trackedOrder.status) ? (trackedOrder.status === 'Arranging' ? 'active' : 'completed') : '')}>
                    <div className="step-circle">2</div>
                    <span className="step-label">Arranging at Bench</span>
                  </div>

                  <div className={'stepper-step ' + (['In transit', 'Delivered'].includes(trackedOrder.status) ? (trackedOrder.status === 'In transit' ? 'active' : 'completed') : '')}>
                    <div className="step-circle">3</div>
                    <span className="step-label">In Transit</span>
                  </div>

                  <div className={'stepper-step ' + (trackedOrder.status === 'Delivered' ? 'completed' : '')}>
                    <div className="step-circle">4</div>
                    <span className="step-label">Delivered</span>
                  </div>
                </div>

                <div style={{ background: '#FFF9FA', borderRadius: '16px', padding: '18px', border: '1px solid var(--border-light)', marginTop: '24px' }}>
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                    <div>
                      <div style={{ fontSize: '11px', fontWeight: '800', color: 'var(--primary)', textTransform: 'uppercase' }}>COURIER DISPATCH</div>
                      <div style={{ fontWeight: '700', fontSize: '14px', marginTop: '2px' }}>
                        {trackedOrder.courier || 'Assigned to Studio Courier'}
                      </div>
                      <div style={{ fontSize: '12px', color: 'var(--text-muted)' }}>Delivery Target: {trackedOrder.dueTime}</div>
                    </div>
                    <span className={'status-chip ' + trackedOrder.status.toLowerCase().replace(/\s+/g, '')}>
                      {trackedOrder.status}
                    </span>
                  </div>

                  {trackedOrder.cardMessage && (
                    <div style={{ marginTop: '16px', paddingTop: '12px', borderTop: '1px dashed var(--border-light)', fontSize: '13px' }}>
                      <span style={{ fontWeight: '700', color: 'var(--text-muted)' }}>Card Dedication: </span>
                      <em>"{trackedOrder.cardMessage}"</em>
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        )}

        {/* TAB 2: ORDER HISTORY */}
        {activeTab === 'history' && (
          <div>
            <div className="page-eyebrow">YOUR RECENT BOUQUETS</div>
            <h2 className="page-title" style={{ marginBottom: '20px' }}>Previous Floral Commissions</h2>

            <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
              {sampleOrders.map(ord => (
                <div key={ord.id} className="content-card" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '24px' }}>
                  <div>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                      <span style={{ fontWeight: '800', color: 'var(--primary)', letterSpacing: '0.5px' }}>{ord.id}</span>
                      <span className={'status-chip ' + ord.status.toLowerCase()}>{ord.status}</span>
                    </div>
                    <h3 style={{ fontSize: '17px', margin: '6px 0 2px 0' }}>{ord.arrangementName}</h3>
                    <div style={{ fontSize: '13px', color: 'var(--text-muted)' }}>Destination: {ord.address} · Courier: {ord.courier}</div>
                  </div>

                  <div style={{ textAlign: 'right' }}>
                    <div style={{ fontSize: '18px', fontWeight: '700', color: 'var(--primary)' }}>₱{ord.total.toLocaleString()}</div>
                    <button 
                      className="btn-secondary" 
                      style={{ marginTop: '8px', padding: '6px 14px', fontSize: '12px' }}
                      onClick={() => {
                        setTrackedOrder(ord);
                        setLookupOrderNumber(ord.id);
                        setActiveTab('tracking');
                      }}
                    >
                      Track Delivery →
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* TAB 3: WEDDING & PRIVATE CONSULTATIONS */}
        {activeTab === 'consult' && (
          <div className="content-card" style={{ padding: '40px' }}>
            <span className="card-subtitle">BESPOKE FLORAL STYLING</span>
            <h2 style={{ fontFamily: 'var(--font-serif)', fontSize: '28px', marginBottom: '8px' }}>
              Book a Private Bridal Consultation
            </h2>
            <p style={{ color: 'var(--text-muted)', fontSize: '14px', lineHeight: '1.6', marginBottom: '24px' }}>
              Meet personally with <strong>Shaira Angela Saladino</strong> (in atelier or online) for bespoke bridal moodboards, seasonal highland bloom selections from Baguio City, and complete Northern Luzon venue styling proposals.
            </p>

            <form onSubmit={(e) => {
              e.preventDefault();
              alert('Thank you! Shaira has received your consultation booking and will contact you via Instagram (@s.shyiee) or phone within 24 hours.');
            }}>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
                <div className="form-group">
                  <label>Your Name</label>
                  <input type="text" className="form-control" required placeholder="e.g. Andrea Lim" />
                </div>
                <div className="form-group">
                  <label>Mobile Number (+63)</label>
                  <input type="tel" className="form-control" required placeholder="0917 XXX XXXX" />
                </div>
              </div>

              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px' }}>
                <div className="form-group">
                  <label>Event Date (Estimated)</label>
                  <input type="date" className="form-control" required defaultValue="2026-12-18" />
                </div>
                <div className="form-group">
                  <label>Event Venue Location</label>
                  <input type="text" className="form-control" required placeholder="e.g. Baguio, Apayao, Vigan, or La Union" />
                </div>
              </div>

              <div className="form-group">
                <label>Floral Styling Vision / Notes</label>
                <textarea className="form-control" rows="4" placeholder="Tell Shaira about your color palette, preferred stems (e.g. White O'Hara roses, peonies), and vision..."></textarea>
              </div>

              <button type="submit" className="btn-primary" style={{ padding: '14px 28px', fontSize: '15px' }}>
                Request Consultation with Shaira
              </button>
            </form>
          </div>
        )}
      </main>

      {/* Owner Profile Modal with Owner_Image and Zero Emojis */}
      {isOwnerModalOpen && (
        <div className="modal-overlay" onClick={() => setIsOwnerModalOpen(false)}>
          <div className="modal-card" style={{ maxWidth: '640px', overflow: 'hidden', padding: 0 }} onClick={(e) => e.stopPropagation()}>
            <div style={{ background: 'linear-gradient(135deg, #2E121E 0%, #4D0025 60%, var(--primary) 100%)', padding: '36px 32px 32px', color: '#FFFFFF', position: 'relative' }}>
              <button 
                className="modal-close-btn" 
                style={{ position: 'absolute', top: '18px', right: '18px', color: '#FFFFFF', background: 'rgba(255,255,255,0.18)', border: 'none' }}
