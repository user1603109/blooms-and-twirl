  <style>
    /* Storefront and Customer Portal enhancements */
    .store-hero {
      background: linear-gradient(135deg, #FFF0F4 0%, #FDE4EB 100%);
      border-radius: var(--radius-card);
      padding: 60px 48px;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border-light);
    }
    .store-hero-content {
      max-width: 620px;
      z-index: 2;
    }
    .store-hero h1 {
      font-family: var(--font-serif);
      font-size: 46px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.15;
      margin-bottom: 16px;
    }
    .store-hero p {
      font-size: 16px;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.6;
    }
    .hero-badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: #FFFFFF;
      color: var(--primary);
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
      border: 1px solid var(--border-light);
    }

    /* Cart Drawer */
    .cart-drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      justify-content: flex-end;
    }
    .cart-drawer {
      width: 100%;
      max-width: 440px;
      height: 100%;
      background: #FFFFFF;
      box-shadow: -4px 0 24px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      padding: 24px;
      animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideInRight {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    /* Order tracker status stepper */
    .order-tracker-stepper {
      display: flex;
      justify-content: space-between;
      position: relative;
      margin: 32px 0 24px;
    }
    .order-tracker-stepper::before {
      content: '';
      position: absolute;
      top: 18px;
      left: 30px;
      right: 30px;
      height: 3px;
      background: var(--border-light);
      z-index: 1;
    }
    .stepper-step {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .step-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 3px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      color: var(--text-muted);
      transition: all 0.25s ease;
    }
    .stepper-step.completed .step-circle {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
    }
    .stepper-step.active .step-circle {
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-subtle);
    }
    .step-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .stepper-step.completed .step-label,
    .stepper-step.active .step-label {
      color: var(--text-main);
      font-weight: 700;
    }

    /* 3D Flip Card for Auth Module */
    .flip-scene {
      perspective: 1200px;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }
    .flip-card-inner {
      position: relative;
      width: 100%;
      transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }
    .flip-card-inner.flipped {
      transform: rotateY(180deg);
    }
    .flip-card-face {
      position: relative;
      width: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: var(--radius-card);
      background: #FFFFFF;
      padding: 36px 32px;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-card);
    }
    .flip-card-back {
      position: absolute;
      top: 0;
      left: 0;
      transform: rotateY(180deg);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: 0.88; }
    }

    /* Landing Specific Styles */
    .landing-hero {
      background: radial-gradient(circle at 10% 20%, #FFF5F7 0%, #FEE8EE 50%, #FDF0F3 100%);
      border-radius: var(--radius-card);
      padding: 70px 48px;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
      text-align: left;
    }
    .landing-hero-content {
      max-width: 640px;
      z-index: 2;
    }
    .landing-hero h1 {
      font-family: var(--font-serif);
      font-size: 52px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.1;
      margin: 16px 0 16px;
      letter-spacing: -0.8px;
    }
    .landing-hero h1 span {
      color: var(--primary);
      font-style: italic;
    }
    .landing-hero p {
      font-size: 17px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 30px;
      max-width: 600px;
    }
    .stats-pill-group {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 24px;
      justify-content: flex-start;
    }
    .stat-mini-pill {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      padding: 8px 18px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }
    .stat-mini-pill strong {
      color: var(--primary);
      font-weight: 800;
    }
    @media (max-width: 900px) {
      .landing-hero {
        padding: 40px 24px;
      }
      .landing-hero h1 {
        font-size: 38px;
      }
    }

    /* Product Grid and Cards */
    .product-grid, .arrangements-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }
    .product-card, .arrangement-card {
      background: #FFFFFF;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-card);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      position: relative;
      transition: all 0.25s ease;
    }
    .product-card:hover, .arrangement-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }
    .product-img, .arrangement-image-wrap img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .product-card:hover .product-img, .arrangement-card:hover img {
      transform: scale(1.04);
    }
    .product-body, .arrangement-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .product-title, .arrangement-name {
      font-family: var(--font-serif);
      font-size: 19px;
      font-weight: 700;
      color: var(--text-main);
    }
    .product-price, .arrangement-price {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
    }
    @media (max-width: 1100px) {
      .product-grid, .arrangements-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 640px) {
      .product-grid, .arrangements-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Shopee-style Smart Address Picker & Modal */
    .shopee-addr-trigger {
      cursor: pointer;
      background: #FFF9FA;
      border: 1.5px solid #FFD1DF;
      border-radius: 12px;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
      user-select: none;
    }
    .shopee-addr-trigger:hover, .shopee-addr-trigger:focus {
      border-color: var(--primary);
      background: #FFF0F5;
      box-shadow: 0 4px 14px rgba(247, 0, 119, 0.1);
    }
    .shopee-tab-btn {
      flex: 1;
      padding: 12px 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-bottom: 2.5px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .shopee-tab-btn:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }
    .shopee-tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      font-weight: 700;
    }
    .shopee-tab-step {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #EAE3E6;
      color: #666;
      font-size: 11px;
      font-weight: 700;
    }
    .shopee-tab-btn.active .shopee-tab-step {
      background: var(--primary);
      color: #FFFFFF;
    }
    .shopee-tab-title {
      max-width: 110px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .shopee-item-row {
      padding: 11px 16px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-main);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
      margin-bottom: 2px;
    }
    .shopee-item-row:hover {
      background: #FFF0F5;
      color: var(--primary);
      font-weight: 600;
    }
    .shopee-item-row.selected {
      background: #FFE6EE;
      color: var(--primary);
      font-weight: 700;
    }
  </style>
</head>

  <script>
    window.addEventListener('error', function(e) {
      console.error('Captured window error:', e);
      var root = document.getElementById('root');

        root.innerHTML = '<div style="padding:40px;text-align:center;font-family:\'Plus Jakarta Sans\',sans-serif;color:#F70077;background:#FFF5F8;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;"><div style="width:48px;height:48px;border-radius:50%;background:#FFE0EB;display:flex;align-items:center;justify-content:center;color:#F70077;margin-bottom:16px;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div><h2 style="margin-bottom:8px;font-family:\'Fraunces\',serif;">Blooms&Twirl Notice</h2><p style="color:#666;max-width:540px;margin-bottom:20px;line-height:1.6;font-size:14px;">' + (e.message || 'Please refresh to launch the floral studio.') + '</p><button onclick="localStorage.clear();location.reload()" style="padding:12px 28px;background:#F70077;color:#fff;border:none;border-radius:9999px;cursor:pointer;font-weight:700;font-size:14px;">Reset Storage & Reload</button></div>';
      }
    });
  </script>

// Storage Helpers
const getInitial = (key, fallback) => {
  try {
    const raw = localStorage.getItem('bt_' + key + '_v2');
    return raw ? JSON.parse(raw) : fallback;
  } catch(e) {
    return fallback;
  }
};

const saveItem = (key, data) => {
  try {
    localStorage.setItem('bt_' + key + '_v2', JSON.stringify(data));
  } catch(e) {}
};

function App() {
  // Navigation mode: 'landing' (Default Landing Page) | 'store' | 'customer_dashboard'
  const [viewMode, setViewMode] = useState('landing');
  const [searchQuery, setSearchQuery] = useState('');
  const [fontsLoaded, setFontsLoaded] = useState(false);

  // Guarantee that Fraunces is fully ready before finishing font gate
  useEffect(() => {
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => setFontsLoaded(true));
    } else {
      setFontsLoaded(true);

            </div>

            {/* Real-time Search Box */}
            <div style={{ padding: '12px 20px', background: '#FFFFFF', borderBottom: '1px solid #F6EDF0' }}>
              <div style={{ position: 'relative' }}>
                <div style={{ position: 'absolute', left: '12px', top: '50%', transform: 'translateY(-50%)', color: 'var(--text-muted)' }}>
                  <Icons.Search />
                </div>
                <input
                  type="text"
                  className="form-control"
                  style={{ paddingLeft: '36px', height: '38px', fontSize: '13px', borderRadius: '10px' }}
                  placeholder={`Search ${addressActiveTab === 'region' ? 'Region (e.g. Cordillera, Ilocos, Cebu, Iloilo...)' : addressActiveTab === 'city' ? 'Province or City (e.g. Apayao, Baguio, Cebu...)' : 'Barangay...'}`}
                  value={addressSearchQuery}
                  onChange={(e) => setAddressSearchQuery(e.target.value)}
                />
              </div>
            </div>

            {/* List Body with Real-time Filtering */}
            <div style={{ padding: '10px 14px', overflowY: 'auto', flex: 1, maxHeight: '340px' }}>
              {addressActiveTab === 'region' && (() => {
                const query = addressSearchQuery.toLowerCase().trim();
                const regions = Object.keys(PHILIPPINES_ADDRESS_DATA).filter(r => !query || r.toLowerCase().includes(query));
                if (regions.length === 0) {
                  return (
                    <div style={{ textAlign: 'center', padding: '30px 16px', color: 'var(--text-muted)', fontSize: '13px' }}>
                      No matching region found for "{addressSearchQuery}".
                    </div>
                  );
                }
                return regions.map(reg => {
                  const isSelected = tempRegion === reg;
                  return (
                    <div 
                      key={reg} 
                      className={`shopee-item-row ${isSelected ? 'selected' : ''}`}
                      onClick={() => handleSelectRegion(reg)}
                    >
                      <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                        <span>{reg}</span>
                      </div>
                      {isSelected && (
                        <span style={{ color: 'var(--primary)', fontWeight: '700' }}><Icons.Check /></span>
                      )}
                    </div>
                  );
                });
              })()}

              {addressActiveTab === 'city' && (() => {
                const query = addressSearchQuery.toLowerCase().trim();
                const cities = Object.keys(PHILIPPINES_ADDRESS_DATA[tempRegion] || {}).filter(c => !query || c.toLowerCase().includes(query));
                if (cities.length === 0) {
                  return (
                    <div style={{ textAlign: 'center', padding: '30px 16px', color: 'var(--text-muted)', fontSize: '13px' }}>
                      No matching province/city found in {tempRegion}.
                    </div>
                  );
                }
                return cities.map(city => {
                  const isSelected = tempProvinceCity === city;
                  return (
                    <div 
                      key={city} 
                      className={`shopee-item-row ${isSelected ? 'selected' : ''}`}
                      onClick={() => handleSelectCity(city)}
                    >
                      <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                        <span>{city}</span>
                      </div>
                      {isSelected && (
                        <span style={{ color: 'var(--primary)', fontWeight: '700' }}><Icons.Check /></span>
                      )}
                    </div>
                  );
                });
              })()}

              {addressActiveTab === 'barangay' && (() => {
                const query = addressSearchQuery.toLowerCase().trim();
                const barangs = ((PHILIPPINES_ADDRESS_DATA[tempRegion] && PHILIPPINES_ADDRESS_DATA[tempRegion][tempProvinceCity]) || []).filter(b => !query || b.toLowerCase().includes(query));
                if (barangs.length === 0) {
                  return (
                    <div style={{ textAlign: 'center', padding: '30px 16px', color: 'var(--text-muted)', fontSize: '13px' }}>
                      No matching barangay found in {tempProvinceCity}.
                    </div>
                  );
                }
                return barangs.map(brgy => {
                  const isSelected = tempBarangay === brgy;
                  return (
                    <div 
                      key={brgy} 
                      className={`shopee-item-row ${isSelected ? 'selected' : ''}`}
                      onClick={() => handleSelectBarangay(brgy)}
                    >
                      <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                        <span>{brgy}</span>
                      </div>
                      {isSelected && (
                        <span style={{ color: 'var(--primary)', fontWeight: '700' }}><Icons.Check /></span>
                      )}
                    </div>
                  );
                });
              })()}
            </div>

            {/* Footer Location Trail & Action */}
            <div style={{ padding: '14px 20px', borderTop: '1px solid #F0E8EB', background: '#FFF9FB', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '10px' }}>
              <div style={{ fontSize: '12px', color: 'var(--text-muted)', display: 'flex', alignItems: 'center', gap: '4px', maxWidth: '65%', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                <span style={{ fontWeight: '700', color: 'var(--text-main)' }}>Selected:</span>
                <span>{tempRegion.split('(')[0].trim()} / {tempProvinceCity.split('(')[0].trim()} / {tempBarangay || '...'}</span>
              </div>
              <button
                type="button"
                className="btn-primary"
                style={{ padding: '8px 20px', fontSize: '13px', borderRadius: '9999px' }}
                onClick={handleConfirmAddress}
                disabled={!tempRegion || !tempProvinceCity || !tempBarangay}
              >
                Confirm Address
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// Error Boundary to prevent blank screens
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, errorInfo) {
    console.error("ErrorBoundary caught:", error, errorInfo);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{ padding: '40px', fontFamily: 'sans-serif', textAlign: 'center', background: '#FFF5F8', minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
          <div style={{ display: 'flex', justifyContent: 'center', marginBottom: '16px', color: '#F70077' }}>
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M12 7.5a4.5 4.5 0 1 1 4.5 4.5M12 7.5A4.5 4.5 0 1 0 7.5 12M12 7.5V3m4.5 9a4.5 4.5 0 1 1-4.5 4.5M16.5 12H21m-9 4.5a4.5 4.5 0 1 1-4.5-4.5M12 16.5V21m-4.5-9H3"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </div>
          <h2 style={{ color: '#F70077', marginBottom: '8px' }}>Blooms&Twirl Studio Portal Notice</h2>
          <p style={{ color: '#666', maxWidth: '500px', marginBottom: '20px', lineHeight: '1.6' }}>
            {this.state.error?.message || 'A temporary display issue occurred.'}
          </p>
          <button 
            onClick={() => { localStorage.clear(); window.location.reload(); }} 
            style={{ background: '#F70077', color: '#fff', border: 'none', padding: '12px 24px', borderRadius: '9999px', fontWeight: '700', cursor: 'pointer' }}
          >
            Reset & Reload Studio
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

// Mount React Root
const rootElement = document.getElementById('root');
try {
  if (ReactDOM.createRoot) {
    const root = ReactDOM.createRoot(rootElement);
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  } else {
    ReactDOM.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>,
      rootElement
    );
  }
} catch(err) {
  console.error("Mount error:", err);
  rootElement.innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif;color:#F70077;"><h2>Studio Launch Error</h2><p>' + err.message + '</p><button onclick="location.reload()" style="padding:10px 20px;background:#F70077;color:#fff;border:none;border-radius:20px;cursor:pointer;">Reload</button></div>';
}
  </script>
</body>
</html>
