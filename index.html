<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blooms&Twirl by Shaira | Artisanal Floral Studio Northern Luzon</title>
  <meta name="description" content="Blooms&Twirl by Shaira - Artisanal flower studio in Apayao, Northern Luzon. Fresh highland mountain blooms supplied directly from Baguio City. Bespoke bouquets, bridal arrangements, and express Northern Luzon delivery.">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  
  <!-- Google Fonts: Fraunces (Serif) & Plus Jakarta Sans with display=block to eliminate Times New Roman FOUT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=block">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=block" rel="stylesheet">
  
  <!-- Main Stylesheet -->
  <link rel="stylesheet" href="./src/styles/main.css">
  
  <!-- React 18 & Babel Standalone with High-Speed CDN & Failover Mirrors -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.12/babel.min.js"></script>
  <script>
    if (!window.React) {
      document.write('<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin><\/script>');
    }
    if (!window.ReactDOM) {
      document.write('<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin><\/script>');
    }
    if (!window.Babel) {
      document.write('<script src="https://unpkg.com/@babel/standalone/babel.min.js"><\/script>');
    }
  </script>

  <style>
    /* Storefront and Customer Portal enhancements */
    .store-hero {
      background: linear-gradient(135deg, #FFF0F4 0%, #FDE4EB 100%);
      border-radius: var(--radius-card);
      padding: 60px 48px;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border-light);
    }
    .store-hero-content {
      max-width: 620px;
      z-index: 2;
    }
    .store-hero h1 {
      font-family: var(--font-serif);
      font-size: 46px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.15;
      margin-bottom: 16px;
    }
    .store-hero p {
      font-size: 16px;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.6;
    }
    .hero-badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: #FFFFFF;
      color: var(--primary);
      border-radius: var(--radius-pill);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 16px;
      border: 1px solid var(--border-light);
    }

    /* Cart Drawer */
    .cart-drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      justify-content: flex-end;
    }
    .cart-drawer {
      width: 100%;
      max-width: 440px;
      height: 100%;
      background: #FFFFFF;
      box-shadow: -4px 0 24px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      padding: 24px;
      animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideInRight {
      from { transform: translateX(100%); }
      to { transform: translateX(0); }
    }

    /* Order tracker status stepper */
    .order-tracker-stepper {
      display: flex;
      justify-content: space-between;
      position: relative;
      margin: 32px 0 24px;
    }
    .order-tracker-stepper::before {
      content: '';
      position: absolute;
      top: 18px;
      left: 30px;
      right: 30px;
      height: 3px;
      background: var(--border-light);
      z-index: 1;
    }
    .stepper-step {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .step-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #FFFFFF;
      border: 3px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      color: var(--text-muted);
      transition: all 0.25s ease;
    }
    .stepper-step.completed .step-circle {
      background: var(--primary);
      border-color: var(--primary);
      color: #FFFFFF;
    }
    .stepper-step.active .step-circle {
      border-color: var(--primary);
      color: var(--primary);
      box-shadow: 0 0 0 4px var(--primary-subtle);
    }
    .step-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }
    .stepper-step.completed .step-label,
    .stepper-step.active .step-label {
      color: var(--text-main);
      font-weight: 700;
    }

    /* 3D Flip Card for Auth Module */
    .flip-scene {
      perspective: 1200px;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }
    .flip-card-inner {
      position: relative;
      width: 100%;
      transition: transform 0.7s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
    }
    .flip-card-inner.flipped {
      transform: rotateY(180deg);
    }
    .flip-card-face {
      position: relative;
      width: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: var(--radius-card);
      background: #FFFFFF;
      padding: 36px 32px;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-card);
    }
    .flip-card-back {
      position: absolute;
      top: 0;
      left: 0;
      transform: rotateY(180deg);
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: 0.88; }
    }

    /* Header Styles & Mobile Responsiveness */
    .landing-header, .site-header {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-light);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      padding: 16px 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 1000;
      transition: all 0.2s ease;
    }
    .header-brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .landing-nav {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    /* Landing Specific Styles */
    .landing-hero {
      background: radial-gradient(circle at 10% 20%, #FFF5F7 0%, #FEE8EE 50%, #FDF0F3 100%);
      border-radius: var(--radius-card);
      padding: 70px 48px;
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-card);
      position: relative;
      overflow: hidden;
      text-align: left;
    }
    .landing-hero-content {
      max-width: 640px;
      z-index: 2;
    }
    .landing-hero h1 {
      font-family: var(--font-serif);
      font-size: 52px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.1;
      margin: 16px 0 16px;
      letter-spacing: -0.8px;
    }
    .landing-hero h1 span {
      color: var(--primary);
      font-style: italic;
    }
    .landing-hero p {
      font-size: 17px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 30px;
      max-width: 600px;
    }
    .landing-hero-actions {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }
    .stats-pill-group {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 24px;
      justify-content: flex-start;
    }
    .stat-mini-pill {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
      padding: 8px 18px;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }
    .stat-mini-pill strong {
      color: var(--primary);
      font-weight: 800;
    }

    /* Feature Overview Cards */
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
    }

    /* Auth Flip Card 2-col Grid */
    .auth-grid-2col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* Bridal Banner */
    .bridal-banner {
      background: linear-gradient(135deg, #2E121E 0%, #4D0025 60%, var(--primary) 100%);
      border-radius: var(--radius-card);
      padding: 48px;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 24px;
      margin-bottom: 40px;
    }

    /* About Us Modal Responsive Grid */
    .about-us-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 22px;
    }

    /* Mobile Responsive Overrides */
    @media (max-width: 900px) {
      .landing-hero {
        padding: 40px 24px;
      }
      .landing-hero h1 {
        font-size: 38px;
      }
    }
    @media (max-width: 768px) {
      .landing-header, .site-header {
        padding: 12px 16px !important;
        flex-direction: column !important;
        align-items: stretch !important;
        gap: 10px !important;
      }
      .header-brand-row {
        display: flex !important;
        align-items: center !important;
        justify-content: space-between !important;
        width: 100% !important;
      }
      .landing-nav {
        width: 100% !important;
        display: flex !important;
        overflow-x: auto !important;
        flex-wrap: nowrap !important;
        padding-bottom: 4px !important;
        -webkit-overflow-scrolling: touch;
        gap: 8px !important;
      }
      .landing-nav::-webkit-scrollbar {
        display: none;
      }
      .landing-nav button,
      .landing-nav .btn-primary,
      .landing-nav .btn-secondary,
      .landing-nav .switcher-btn {
        white-space: nowrap !important;
        flex-shrink: 0 !important;
        padding: 8px 14px !important;
        font-size: 13px !important;
      }
      .page-content {
        padding: 16px 14px 60px 14px !important;
      }
      .landing-hero {
        padding: 30px 18px !important;
        border-radius: 18px !important;
        margin-bottom: 28px !important;
      }
      .landing-hero h1 {
        font-size: 28px !important;
        line-height: 1.2 !important;
        letter-spacing: -0.4px !important;
        margin: 12px 0 14px !important;
      }
      .landing-hero p {
        font-size: 14px !important;
        line-height: 1.55 !important;
        margin-bottom: 22px !important;
      }
      .landing-hero-actions {
        flex-direction: column !important;
        gap: 10px !important;
        width: 100% !important;
      }
      .landing-hero-actions .btn-primary,
      .landing-hero-actions .btn-secondary {
        width: 100% !important;
        justify-content: center !important;
        padding: 12px 18px !important;
        font-size: 14px !important;
      }
      .stats-pill-group {
        flex-direction: column !important;
        gap: 8px !important;
        margin-top: 18px !important;
        width: 100% !important;
      }
      .stat-mini-pill {
        width: 100% !important;
        justify-content: flex-start !important;
        padding: 9px 14px !important;
        font-size: 12px !important;
      }
      .overview-grid {
        grid-template-columns: 1fr !important;
        gap: 14px !important;
      }
      .overview-grid .content-card {
        padding: 22px 18px !important;
      }
      #auth-panel-section {
        padding: 40px 0 50px !important;
        margin-bottom: 40px !important;
      }
      #auth-panel-section h2 {
        font-size: 26px !important;
      }
      .flip-scene {
        max-width: 100% !important;
        width: 100% !important;
      }
      .flip-card-face {
        padding: 24px 18px !important;
        border-radius: 18px !important;
      }
      .auth-grid-2col {
        grid-template-columns: 1fr !important;
        gap: 0 !important;
      }
      .bridal-banner {
        padding: 26px 18px !important;
        border-radius: 18px !important;
        gap: 18px !important;
      }
      .bridal-banner h3 {
        font-size: 22px !important;
      }
      .bridal-banner .btn-secondary {
        width: 100% !important;
        justify-content: center !important;
      }
      .about-us-grid {
        grid-template-columns: 1fr !important;
        gap: 10px !important;
      }
      .about-us-banner {
        padding: 24px 18px !important;
      }
      .about-us-banner-header {
        flex-direction: column !important;
        align-items: flex-start !important;
        gap: 14px !important;
      }
      .about-us-body {
        padding: 20px 18px !important;
      }
    }

    /* Product Grid and Cards */
    .product-grid, .arrangements-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 24px;
    }
    .product-card, .arrangement-card {
      background: #FFFFFF;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-card);
      overflow: hidden;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      position: relative;
      transition: all 0.25s ease;
    }
    .product-card:hover, .arrangement-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }
    .product-img, .arrangement-image-wrap img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .product-card:hover .product-img, .arrangement-card:hover img {
      transform: scale(1.04);
    }
    .product-body, .arrangement-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .product-title, .arrangement-name {
      font-family: var(--font-serif);
      font-size: 19px;
      font-weight: 700;
      color: var(--text-main);
    }
    .product-price, .arrangement-price {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
    }
    @media (max-width: 1100px) {
      .product-grid, .arrangements-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    @media (max-width: 640px) {
      .product-grid, .arrangements-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Shopee-style Smart Address Picker & Modal */
    .shopee-addr-trigger {
      cursor: pointer;
      background: #FFF9FA;
      border: 1.5px solid #FFD1DF;
      border-radius: 12px;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.2s ease;
      user-select: none;
    }
    .shopee-addr-trigger:hover, .shopee-addr-trigger:focus {
      border-color: var(--primary);
      background: #FFF0F5;
      box-shadow: 0 4px 14px rgba(247, 0, 119, 0.1);
    }
    .shopee-tab-btn {
      flex: 1;
      padding: 12px 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      background: transparent;
      border: none;
      border-bottom: 2.5px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .shopee-tab-btn:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }
    .shopee-tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      font-weight: 700;
    }
    .shopee-tab-step {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #EAE3E6;
      color: #666;
      font-size: 11px;
      font-weight: 700;
    }
    .shopee-tab-btn.active .shopee-tab-step {
      background: var(--primary);
      color: #FFFFFF;
    }
    .shopee-tab-title {
      max-width: 110px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .shopee-item-row {
      padding: 11px 16px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-main);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
      margin-bottom: 2px;
    }
    .shopee-item-row:hover {
      background: #FFF0F5;
      color: var(--primary);
      font-weight: 600;
    }
    .shopee-item-row.selected {
      background: #FFE6EE;
      color: var(--primary);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div id="root">
    <!-- Initial Loading indicator: styled with real fonts and active animation -->
    <div id="loading-splash" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif; background:#FFF5F8;">
      <div style="width:62px; height:62px; border-radius:18px; background:#FFE0EB; border:1px solid #FFC2D6; display:flex; align-items:center; justify-content:center; color:#F70077; margin-bottom:20px; box-shadow:0 8px 24px rgba(247,0,119,0.16); animation:pulse 1.8s infinite ease-in-out;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#F70077" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 7.5a4.5 4.5 0 1 1 4.5 4.5M12 7.5A4.5 4.5 0 1 0 7.5 12M12 7.5V3m4.5 9a4.5 4.5 0 1 1-4.5 4.5M16.5 12H21m-9 4.5a4.5 4.5 0 1 1-4.5-4.5M12 16.5V21m-4.5-9H3"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </div>
      <div id="loading-brand-title" style="font-family:'Fraunces', 'Plus Jakarta Sans', -apple-system, sans-serif; font-size:32px; font-weight:700; color:#1C1917; margin-bottom:6px; letter-spacing:-0.5px;">
        Blooms<span style="color:#F70077;">&</span>Twirl
      </div>
      <div style="font-size:11px; font-weight:800; letter-spacing:1.5px; text-transform:uppercase; color:#826F76; margin-bottom:16px;">
        BY SHAIRA · FLORAL STUDIO
      </div>
      <div style="display:flex; align-items:center; gap:10px; font-size:13px; color:#826F76;">
        <span style="display:inline-block; width:16px; height:16px; border:2.5px solid #FCD0E3; border-top-color:#F70077; border-radius:50%; animation:spin 0.8s linear infinite;"></span>
        <span style="font-weight:600;">Opening Blooms&Twirl by Shaira...</span>
      </div>
    </div>
  </div>

  <!-- Error listener & Watchdog to catch and report any script or compilation errors -->
  <script>
    (function() {
      var lastErrors = [];
      function renderDiagnosticError(msg, detail) {
        var splash = document.getElementById('loading-splash');
        var root = document.getElementById('root');
        if (!splash && !root) return;
        
        var displayDetail = detail || (lastErrors.length > 0 ? lastErrors.join('<br>') : '');
        var cardHtml = '<div style="padding:32px 24px;text-align:center;font-family:\'Plus Jakarta Sans\',-apple-system,sans-serif;color:#1C1917;background:#FFF5F8;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;box-sizing:border-box;">' +
          '<div style="max-width:520px;width:100%;background:#ffffff;border:1px solid #FFD0E0;border-radius:24px;padding:36px 28px;box-shadow:0 12px 36px rgba(247,0,119,0.08);">' +
            '<div style="width:54px;height:54px;border-radius:18px;background:#FFE0EB;display:flex;align-items:center;justify-content:center;color:#F70077;margin:0 auto 18px auto;">' +
              '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>' +
            '</div>' +
            '<h2 style="font-family:\'Fraunces\',serif;font-size:24px;color:#1C1917;margin:0 0 10px 0;">Blooms&Twirl Notice</h2>' +
            '<p style="color:#6B5E62;font-size:14px;line-height:1.6;margin:0 0 20px 0;">' + (msg || 'The studio interface encountered a loading delay.') + '</p>' +

// --- High-Resolution 50MB Image Engine (IndexedDB + Canvas) ---
const BT_IDB = {
  DB_NAME: 'BT_HighRes_FloralVault',
  STORE_NAME: 'product_images_hd',
  async getDB() {
    if (!window.indexedDB) return null;
    return new Promise((resolve) => {
      const req = indexedDB.open(this.DB_NAME, 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(this.STORE_NAME)) {
          db.createObjectStore(this.STORE_NAME, { keyPath: 'id' });
        }
      };
      req.onsuccess = (e) => resolve(e.target.result);
      req.onerror = () => resolve(null);
    });
  },
  async getImage(id) {
    try {
      const db = await this.getDB();
      if (!db || !id) return null;
      return new Promise((resolve) => {
        const tx = db.transaction(this.STORE_NAME, 'readonly');
        const req = tx.objectStore(this.STORE_NAME).get(id);
        req.onsuccess = () => resolve(req.result ? req.result.dataUrl : null);
        req.onerror = () => resolve(null);
      });
    } catch(e) {
      return null;
    }
  },
  async saveImage(id, dataUrl) {
    try {
      const db = await this.getDB();
      if (!db || !id || !dataUrl) return;
      const tx = db.transaction(this.STORE_NAME, 'readwrite');
      tx.objectStore(this.STORE_NAME).put({ id, dataUrl, timestamp: Date.now() });
    } catch(e) {
      console.warn('IDB saveImage error:', e);
    }
  },
  async deleteImage(id) {
    try {
      const db = await this.getDB();
      if (!db || !id) return;
      const tx = db.transaction(this.STORE_NAME, 'readwrite');
      tx.objectStore(this.STORE_NAME).delete(id);
    } catch(e) {}
  }
};

  } catch(e) {
    console.warn('Error reading bt_' + key + '_v2 from localStorage:', e);
    return fallback;
  }
};

const saveItem = (key, data) => {
  try {
    localStorage.setItem('bt_' + key + '_v2', JSON.stringify(data));
  } catch(e) {
    console.warn('localStorage.setItem quota reached for key:', key, e);
    if (key === 'arrangements' && Array.isArray(data)) {
      try {
        data.forEach(item => {
          if (item.image && item.image.startsWith('data:image')) {
            BT_IDB.saveImage(item.id, item.image);
          }
        });
        const lightweightData = data.map(item => {
          if (item.image && item.image.startsWith('data:image') && item.image.length > 50000) {
            return { ...item, image: 'idb:' + item.id };
          }
          return item;
        });
        localStorage.setItem('bt_' + key + '_v2', JSON.stringify(lightweightData));
      } catch(err2) {
        console.error('Critical quota error saving in index.html:', err2);
      }
    }
  }
};

            {/* VIEW A: BESPOKE CUSTOM ORDERS 5-STAGE MONITOR                             */}
            {/* ========================================================================= */}
            {customerTrackerTab === 'custom' && (
              <div>
                {/* Custom Order Quick Select Pills */}
                <div style={{ display: 'flex', alignItems: 'center', gap: '8px', flexWrap: 'wrap', marginBottom: '22px' }}>

                    type="text" 
                    className="form-control" 
                    placeholder="Enter Custom Order ID (e.g. CUST-101)"
                    value={lookupCustomOrderId}
                    onChange={(e) => setLookupCustomOrderId(e.target.value)}
                  />
                  <button 
                    type="button" 
                    className="btn-primary" 
                    onClick={() => {
                      const found = customOrders.find(co => co.id.toUpperCase() === lookupCustomOrderId.trim().toUpperCase());
                      if (found) {
                        setTrackedCustomOrder(found);
                      } else {
                        showToast('Custom commission #' + lookupCustomOrderId + ' not found. Try ' + customOrders.map(c=>c.id).join(', '), 'error', 'Commission Not Found');
                      }
                    }}
                  >
                    Look Up Commission
                  </button>
                </div>

                {trackedCustomOrder && (() => {
                  // Map 9 admin stages to 5 customer monitoring stages
                  const getCustomTrackingStep = (st) => {
                    switch (st) {
                      case 'New / Pending':
                        return 1; // Order Received
                      case 'Substitution Needed':
                      case 'Scheduled for [Date/Time]':
                        return 2; // Florist Reviewing
                      case 'Arranging in Progress':
                      case 'Ready in Cold Room':
                        return 3; // Arranging
                      case 'Ready at Front Counter':
                        return 4; // Ready for Pickup
                      case 'Picked Up / Completed':
                        return 5; // Picked Up
                      default:
                        return 1;
                    }
                  };

                  const currentStep = getCustomTrackingStep(trackedCustomOrder.status);
                  const isCancelled = trackedCustomOrder.status === 'Cancelled';
                  const isSubstitutionNeeded = trackedCustomOrder.status === 'Substitution Needed' || Boolean(trackedCustomOrder.substitutionProposal);

                  const CUSTOM_FIVE_STEPS = [
                    { step: 1, label: 'Order Received', desc: 'Commission logged in atelier' },
                    { step: 2, label: 'Florist Reviewing', desc: 'Flower availability check' },
                    { step: 3, label: 'Arranging', desc: 'Handcrafted on studio bench' },
                    { step: 4, label: 'Ready for Pickup', desc: 'Conditioned at front desk' },
                    { step: 5, label: 'Picked Up', desc: 'Safely received by customer' }
                  ];

                  return (
                    <div className="content-card" style={{ padding: '36px' }}>
                      {/* Custom Order Summary Header */}
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', borderBottom: '1px solid var(--border-light)', paddingBottom: '20px', flexWrap: 'wrap', gap: '16px' }}>
                        <div>
                          <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '6px' }}>
                            <span className="card-subtitle" style={{ margin: 0 }}>BESPOKE CUSTOM ORDER</span>
                            <span className={'status-chip ' + (trackedCustomOrder.status || 'newpending').toLowerCase().replace(/[^a-z]/g, '')}>
                              {trackedCustomOrder.status}
                            </span>
                          </div>
                          <h2 style={{ fontFamily: 'var(--font-serif)', fontSize: '26px', margin: '4px 0', color: '#1C1917' }}>
                            {trackedCustomOrder.id} · {trackedCustomOrder.customerName}
                          </h2>
                          <div style={{ fontSize: '13px', color: 'var(--text-muted)' }}>
                            Fulfillment: <strong>{trackedCustomOrder.requestedDate} @ {trackedCustomOrder.timeSlot}</strong> ({trackedCustomOrder.pickupType})
                          </div>
                          {trackedCustomOrder.recipient && (
                            <div style={{ fontSize: '13px', color: '#0369A1', marginTop: '3px' }}>
                              Recipient: <strong>{trackedCustomOrder.recipient}</strong>
                            </div>
                          )}
                        </div>

                        <div style={{ textAlign: 'right' }}>
                          <div style={{ fontSize: '13px', color: 'var(--text-muted)' }}>Estimated Price</div>
                          <div style={{ fontFamily: 'var(--font-serif)', fontSize: '26px', fontWeight: '700', color: 'var(--primary)' }}>
                            ₱{(trackedCustomOrder.estimatedPrice || trackedCustomOrder.total || 0).toLocaleString()}
                          </div>
                          <span style={{ fontSize: '10px', background: '#DCFCE7', color: '#15803D', padding: '2px 8px', borderRadius: '4px', fontWeight: '700' }}>
                            Pre-authorized / Confirmed
                          </span>
                        </div>
                      </div>

                      {/* 5-Step Customer Monitoring Stepper (Order Received -> Florist Reviewing -> Arranging -> Ready for Pickup -> Picked Up) */}
                      {!isCancelled && (
                        <div className="order-tracker-stepper" style={{ margin: '36px 0 28px' }}>
                          {CUSTOM_FIVE_STEPS.map(s => {
                            const isCompleted = currentStep > s.step || (currentStep === 5 && s.step === 5);
                            const isActive = currentStep === s.step && currentStep !== 5;
                            return (
                              <div key={s.step} className={`stepper-step ${isCompleted ? 'completed' : ''} ${isActive ? 'active' : ''}`}>
                                <div className="step-circle">
                                  {isCompleted ? <Icons.Check /> : s.step}
                                </div>
                                <span className="step-label">{s.label}</span>
                                <span style={{ fontSize: '11px', color: 'var(--text-muted)', textAlign: 'center', maxWidth: '110px', lineHeight: '1.3' }}>
                                  {s.desc}
                                </span>
                              </div>
                            );
                          })}
                        </div>
                      )}

                      {/* Cancellation Status Banner */}
                      {isCancelled && (
                        <div style={{ background: '#FFF1F2', border: '1.5px solid #FECDD3', borderRadius: '16px', padding: '22px', marginTop: '20px', color: '#9F1239' }}>
                          <div style={{ display: 'flex', alignItems: 'center', gap: '10px', fontWeight: '800', fontSize: '16px' }}>
                            <Icons.AlertCircle /> Order Voided & Cancelled

                      )}

                      {/* ========================================================================= */}
                      {/* INTERACTIVE FLORIST REVIEW FEEDBACK & CANCEL ACTION (STAGE 2)             */}
                      {/* ========================================================================= */}
                      {!isCancelled && currentStep === 2 && isSubstitutionNeeded && trackedCustomOrder.substitutionProposal && (
                        <div style={{ 
                          background: '#FFF0F5', 
                          border: '2px solid #FF80AB', 
                          borderRadius: '18px', 
                          padding: '24px', 
                          marginTop: '24px',
                          boxShadow: '0 8px 30px rgba(247,0,119,0.1)'
                        }}>
                          <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '8px' }}>
                            <span style={{ background: '#F50057', color: '#FFFFFF', fontSize: '11px', fontWeight: '800', padding: '3px 10px', borderRadius: '9999px', textTransform: 'uppercase', letterSpacing: '0.8px' }}>
                              Action Required · Florist Notice
                            </span>
                            <span style={{ fontSize: '12px', color: '#C2185B', fontWeight: '700' }}>
                              Flower Availability Counter-Proposal
                            </span>
                          </div>

                          <h3 style={{ fontFamily: 'var(--font-serif)', fontSize: '20px', margin: '6px 0 10px', color: '#1C1917' }}>
                            Requested Flower Unavailable: Shaira's Proposed Alternative

                          <p style={{ fontSize: '13px', color: '#4A3B40', lineHeight: '1.6', margin: '0 0 16px', background: '#FFFFFF', padding: '12px 16px', borderRadius: '12px', border: '1px solid #FFE4E6' }}>

                            {trackedCustomOrder.substitutionProposal.alternativeImage && (
                              <img 
                                src={trackedCustomOrder.substitutionProposal.alternativeImage} 
                                alt="Proposed Alternative Bloom" 
                                style={{ width: '92px', height: '92px', borderRadius: '12px', objectFit: 'cover', border: '1.5px solid #FF80AB', flexShrink: 0 }} 
                              />
                            )}

                              <div style={{ fontSize: '11px', fontWeight: '800', color: 'var(--primary)', textTransform: 'uppercase' }}>PROPOSED ALTERNATIVE FLOWER:</div>
                              <div style={{ fontSize: '16px', fontWeight: '800', color: '#1C1917', margin: '2px 0 4px' }}>
                                {trackedCustomOrder.substitutionProposal.proposedAlternative}
                              </div>
                              <div style={{ fontSize: '12px', color: '#047857', fontWeight: '700' }}>
                                Price Impact: {trackedCustomOrder.substitutionProposal.priceDifference}
                              </div>
                              <div style={{ fontSize: '11px', color: 'var(--text-muted)', marginTop: '2px' }}>

                              type="button"

                              <div style={{ fontSize: '12px', color: 'var(--text-muted)' }}>Standard styling</div>

                        {trackedCustomOrder.cardMessage && (

                            <em style={{ color: 'var(--text-main)' }}>"{trackedCustomOrder.cardMessage}"</em>
                          </div>

                      {/* Customer Rating & Review Form for Custom Orders */}

                            <span style={{ fontSize: '24px' }}>💐</span>
                            <div>
                              <h3 style={{ margin: 0, fontFamily: 'var(--font-serif)', fontSize: '20px', color: '#1C1917' }}>
                                Commission Received! Share Your Review with Shaira
                              </h3>
                              <p style={{ margin: '3px 0 0', fontSize: '13px', color: 'var(--text-muted)' }}>
                                We hope your bespoke arrangement exceeded expectations! Please rate and review your custom commission for our atelier portfolio.
                              </p>
                            </div>
                          </div>

                          {hasReviewed && hasReviewed[trackedCustomOrder.id] ? (
                            <div style={{ background: '#F0FDF4', border: '1px solid #BBF7D0', borderRadius: '12px', padding: '16px 20px', marginTop: '16px', color: '#15803D', display: 'flex', alignItems: 'center', gap: '12px' }}>

                                <div style={{ fontSize: '12px', marginTop: '2px', color: '#166534' }}>

                                <label style={{ fontSize: '13px', fontWeight: '700', color: 'var(--text-main)' }}>Your Rating:</label>

                                  {[1, 2, 3, 4, 5].map(star => (
                                    <button
                                      key={star}
                                      type="button"
                                      onClick={() => setReviewRating(star)}
                                      style={{
                                        background: 'none',
                                        border: 'none',
                                        fontSize: '26px',
                                        color: star <= reviewRating ? '#F59E0B' : '#D1D5DB',
                                        cursor: 'pointer',
                                        padding: '2px',
                                        lineHeight: 1
                                      }}
                                    >
                                      ★
                                    </button>
                                  ))}
                                </div>
                                <span style={{ fontSize: '13px', fontWeight: '800', color: '#D97706' }}>
                                  {reviewRating === 5 ? '5.0 - Artisanal Masterpiece' : `${reviewRating}.0 Stars`}
                                </span>
                              </div>

                              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '12px', marginBottom: '12px' }}>
                                <div>
                                  <label style={{ fontSize: '12px', fontWeight: '700', display: 'block', marginBottom: '4px' }}>Reviewer Name</label>

                                    className="form-control"

                                  />
                                </div>
                              </div>

                              <div style={{ marginBottom: '14px' }}>
                                <label style={{ fontSize: '12px', fontWeight: '700', display: 'block', marginBottom: '4px' }}>Custom Commission Feedback</label>
                                <textarea
                                  className="form-control"
                                  rows="3"
                                  placeholder="How did the custom wrapper, color palette, and highland blooms turn out? What was the recipient's reaction?"
                                  value={reviewComment}
                                  onChange={(e) => setReviewComment(e.target.value)}
                                  required
                                  style={{ width: '100%', resize: 'vertical' }}
                                />
                              </div>

                              <div style={{ display: 'flex', justifyContent: 'flex-end' }}>
                                <button type="submit" className="btn-primary" style={{ padding: '10px 24px', fontSize: '13px', fontWeight: '700' }}>
                                  ⭐ Publish Bespoke Review
                                </button>
                              </div>
                            </form>
                          )}
                        </div>
                      )}

                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '24px', paddingTop: '18px', borderTop: '1px solid var(--border-subtle)', flexWrap: 'wrap', gap: '12px' }}>
                        <div style={{ fontSize: '13px', color: 'var(--text-muted)' }}>
                          Florist Atelier Hotline: <strong>+63 917 555 0142</strong> (Apayao Studio & Baguio City Hub)
                        </div>
                        <button className="btn-secondary" onClick={() => setIsCustomOrderModalOpen(true)}>
                          <Icons.Sparkles /> Design Another Custom Bouquet
                        </button>
                      </div>
                    </div>
                  );
                })()}
              </div>
            )}

            {/* ========================================================================= */}
            {/* VIEW B: STANDARD CATALOGUE ORDERS TRACKER                                 */}
            {/* ========================================================================= */}
            {customerTrackerTab === 'standard' && (
              <div>
                {/* Quick Order Lookup and History */}
                <div style={{ display: 'flex', gap: '12px', marginBottom: '20px' }}>
                  <input 
                    type="text" 
                    className="form-control" 
                    placeholder="Enter Order Number (e.g. BT-2041)"
                    value={lookupOrderNumber}
                    onChange={(e) => setLookupOrderNumber(e.target.value)}
                  />
                  <button className="btn-primary" onClick={() => {
                    const found = orders.find(o => o.id.toUpperCase() === lookupOrderNumber.trim().toUpperCase());
                    if (found) {
                      setTrackedOrder(found);
                    } else {
                      showToast('Order #' + lookupOrderNumber + ' not found in the studio registry. Try ' + orders.slice(0, 3).map(o=>o.id).join(', '), 'error', 'Order Not Found');
                    }
                  }}>
                    Look Up Order
                  </button>
                </div>

                {/* Quick Clickable Recent Order Chips */}
                <div style={{ display: 'flex', alignItems: 'center', gap: '8px', flexWrap: 'wrap', marginBottom: '28px' }}>
                  <span style={{ fontSize: '12px', fontWeight: '700', color: 'var(--text-muted)' }}>Quick Select:</span>
                  {orders.slice(0, 5).map(o => (
                    <button
                      key={o.id}
                      onClick={() => {
                        setTrackedOrder(o);
                        setLookupOrderNumber(o.id);
                      }}
                      style={{
                        padding: '5px 12px',
                        borderRadius: '9999px',
                        border: (trackedOrder && trackedOrder.id === o.id) ? '1.5px solid var(--primary)' : '1px solid var(--border-light)',
                        background: (trackedOrder && trackedOrder.id === o.id) ? 'var(--primary-subtle)' : '#FFFFFF',
                        color: (trackedOrder && trackedOrder.id === o.id) ? 'var(--primary)' : 'var(--text-main)',
                        fontSize: '12px',
                        fontWeight: '700',
                        cursor: 'pointer',
                        display: 'inline-flex',
                        alignItems: 'center',
                        gap: '6px'
                      }}
                    >
                      <span>{o.id}</span>
                      <span style={{ fontSize: '11px', color: 'var(--text-muted)', fontWeight: '500' }}>· {o.customerName.split(' ')[0]}</span>
                    </button>
                  ))}
                </div>

                {trackedOrder && (() => {
                  const getCustomerTrackingStep = (st) => {
                    switch (st) {
                      case 'Pending / New':
                      case 'Unfulfilled':
                      case 'Fresh':
                      case 'To Pick':
                      case 'Packing':
                        return 1;
                      case 'To Pick & Pack':
                      case 'Ready to Ship':
                      case 'Ready to Ship (RTS)':
                      case 'Arranging':
                        return 2;
                      case 'Handed to Courier':
                      case 'In Transit':
                      case 'In Hub Transit':
                      case 'In transit':
                        return 3;
                      case 'Out for Delivery':
                        return 4;
                      case 'Delivered / Completed':
                      case 'Delivered':
                      case 'Received by Customer':
                        return 5;
                      default:
                        return 1;
                    }
                  };

                  const currentStep = getCustomerTrackingStep(trackedOrder.status);
                  const isException = ['Delivery Failed', 'Returned / RTS', 'Returned', 'Cancelled'].includes(trackedOrder.status);

                  const FIVE_STEPS = [
                    { step: 1, label: 'Order Received', desc: 'Queued & verified' },
                    { step: 2, label: 'Preparing', desc: 'Cold room & bench assembly' },
                    { step: 3, label: 'In Transit', desc: 'Regional express dispatch' },
                    { step: 4, label: 'Out for Delivery', desc: 'Courier on final route' },
                    { step: 5, label: 'Received/Delivered', desc: 'Safely delivered' }
                  ];

                  return (
                    <div className="content-card" style={{ padding: '36px' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', borderBottom: '1px solid var(--border-light)', paddingBottom: '20px', flexWrap: 'wrap', gap: '16px' }}>

                          <div style={{ display: 'flex', alignItems: 'center', gap: '10px', marginBottom: '6px' }}>

                              {trackedOrder.status}

                          </div>
                          <h2 style={{ fontFamily: 'var(--font-serif)', fontSize: '26px', margin: '4px 0' }}>
                            {trackedOrder.id} · {trackedOrder.customerName}

                          <div style={{ fontSize: '13px', color: 'var(--text-muted)' }}>

                          <div style={{ fontSize: '13px', color: 'var(--text-muted)' }}>Total Amount</div>

                            ₱{trackedOrder.total.toLocaleString()}
                          </div>
                          <div style={{ fontSize: '11px', color: 'var(--text-muted)', marginTop: '2px' }}>
                            Payment: <strong>{trackedOrder.paymentMethod || 'GCash'}</strong>
                          </div>
                        </div>
                      </div>

                      {/* 5-Step Customer Monitoring Stepper */}
                      <div className="order-tracker-stepper" style={{ margin: '36px 0 28px' }}>
                        {FIVE_STEPS.map(s => {
                          const isCompleted = currentStep > s.step || (currentStep === 5 && s.step === 5);
                          const isActive = currentStep === s.step && currentStep !== 5;
                          return (
                            <div key={s.step} className={`stepper-step ${isCompleted ? 'completed' : ''} ${isActive ? 'active' : ''}`}>
                              <div className="step-circle">
                                {isCompleted ? <Icons.Check /> : s.step}
                              </div>
                              <span className="step-label">{s.label}</span>
                              <span style={{ fontSize: '11px', color: 'var(--text-muted)', textAlign: 'center', maxWidth: '110px', lineHeight: '1.3' }}>
                                {s.desc}
                              </span>
                            </div>
                          );
                        })}

                        <div style={{ background: '#FFF1F2', border: '1px solid #FECDD3', borderRadius: '14px', padding: '14px 18px', color: '#9F1239', fontSize: '13px', marginTop: '16px', display: 'flex', alignItems: 'center', gap: '10px' }}>

                            <strong>Order Status Alert ({trackedOrder.status}):</strong> Your delivery is currently flagged for courier review or rescheduling. Please call our atelier support desk at <strong>+63 917 555 0142</strong> or message us on WhatsApp.

                            <div style={{ fontSize: '11px', fontWeight: '800', color: 'var(--primary)', textTransform: 'uppercase', letterSpacing: '0.6px' }}>ASSIGNED COURIER</div>
                            <div style={{ fontWeight: '700', fontSize: '14px', marginTop: '3px', color: 'var(--text-main)' }}>
                              {trackedOrder.courier && trackedOrder.courier !== 'To be assigned' ? (`${trackedOrder.courier} (Blooms&Twirl Fleet)`) : 'Awaiting atelier bench staging'}
                            </div>
                            <div style={{ fontSize: '12px', color: 'var(--text-muted)', marginTop: '2px' }}>Northern Luzon Temperature-Controlled Run</div>
                          </div>

                          <div>
                            <div style={{ fontSize: '11px', fontWeight: '800', color: 'var(--primary)', textTransform: 'uppercase', letterSpacing: '0.6px' }}>DELIVERY WINDOW</div>
                            <div style={{ fontWeight: '700', fontSize: '14px', marginTop: '3px', color: 'var(--text-main)' }}>
                              {trackedOrder.dueTime || 'Before 5:00 PM'}
                            </div>
                            <div style={{ fontSize: '12px', color: 'var(--text-muted)', marginTop: '2px' }}>Placed on {trackedOrder.date || 'Today'}</div>
                          </div>

                          <div>
                            <div style={{ fontSize: '11px', fontWeight: '800', color: 'var(--primary)', textTransform: 'uppercase', letterSpacing: '0.6px' }}>PAYMENT METHOD</div>
                            <div style={{ fontWeight: '700', fontSize: '14px', marginTop: '3px', color: 'var(--text-main)' }}>
                              {trackedOrder.paymentMethod || 'GCash'}
                            </div>
                            <div style={{ fontSize: '12px', color: '#059669', fontWeight: '600', marginTop: '2px' }}>Verified & Confirmed</div>
                          </div>
                        </div>

                        {trackedOrder.cardMessage && (
                          <div style={{ marginTop: '16px', paddingTop: '14px', borderTop: '1px dashed var(--border-light)', fontSize: '13px' }}>
                            <span style={{ fontWeight: '700', color: 'var(--primary)' }}>Handwritten Dedication Card: </span>
                            <em style={{ color: 'var(--text-main)' }}>"{trackedOrder.cardMessage}"</em>
                          </div>
                        )}
                      </div>

                      {/* Customer Rating & Review Form (Triggered once order reaches Delivered / Received stage) */}
                      {(currentStep === 5 || ['delivered', 'received by customer'].includes((trackedOrder.status || '').toLowerCase())) && (
                        <div style={{ background: '#FFF9FB', border: '2px solid #FBCFE8', borderRadius: '18px', padding: '24px', marginTop: '24px', boxShadow: '0 8px 24px rgba(244,63,94,0.08)' }}>
                          <div style={{ display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '8px' }}>
                            <span style={{ fontSize: '24px' }}>🎉</span>
                            <div>
                              <h3 style={{ margin: 0, fontFamily: 'var(--font-serif)', fontSize: '20px', color: '#1C1917' }}>
                                Your Blooms Have Arrived! Rate & Review Your Experience
                              </h3>
                              <p style={{ margin: '3px 0 0', fontSize: '13px', color: 'var(--text-muted)' }}>
                                Please share your feedback on flower freshness, arrangement design, and presentation. Your review will be featured in our Atelier Reviews!
                              </p>
                            </div>
                          </div>

                          {hasReviewed && hasReviewed[trackedOrder.id] ? (
                            <div style={{ background: '#F0FDF4', border: '1px solid #BBF7D0', borderRadius: '12px', padding: '16px 20px', marginTop: '16px', color: '#15803D', display: 'flex', alignItems: 'center', gap: '12px' }}>
                              <span style={{ fontSize: '22px' }}>✓</span>

                    >
                      <option value="Atelier Front Counter Pickup">Atelier Front Counter Pickup (Luna, Apayao)</option>
                      <option value="Northern Luzon Express Delivery">Northern Luzon Express Delivery (Direct to Address)</option>
                    </select>
                  </div>
                </div>

                <div className="form-group">
                  <label style={{ fontSize: '12px', fontWeight: '600' }}>Complimentary Handwritten Dedication Card Note</label>
                  <textarea 
                    className="form-control" 
                    rows="2"
                    placeholder="Write a heartfelt personal message to be written with calligraphic ink on cotton cardstock..."
                    value={customCardMessage}
                    onChange={(e) => setCustomCardMessage(e.target.value)}
                  />
                </div>
              </div>

              {/* Step 8: Price Summary & Submission */}
              <div style={{ background: '#FFF0F5', border: '1.5px solid #FF80AB', borderRadius: '16px', padding: '20px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexWrap: 'wrap', gap: '16px', marginBottom: '16px' }}>
                <div>
                  <div style={{ fontSize: '12px', fontWeight: '800', color: 'var(--primary)', textTransform: 'uppercase' }}>ESTIMATED TOTAL INVESTMENT:</div>
                  <div style={{ fontFamily: 'var(--font-serif)', fontSize: '32px', fontWeight: '700', color: '#1C1917' }}>
                    ₱{calculateCustomOrderPrice().toLocaleString()}
                  </div>
                  <div style={{ fontSize: '12px', color: 'var(--text-muted)' }}>
                    Includes {customStemCount} fresh stems, {customWrapper.name}, custom ribbon & studio conditioning
                  </div>
                </div>

                <div style={{ display: 'flex', gap: '10px' }}>
                  <button type="button" className="btn-secondary" style={{ padding: '12px 20px' }} onClick={() => setIsCustomOrderModalOpen(false)}>
                    Discard
                  </button>
                  <button type="submit" className="btn-primary" style={{ padding: '14px 28px', fontSize: '15px' }}>
                    Send Custom Order to Florist Review ➔
                  </button>
                </div>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* Dedicated In-App Toast Notification */}
      {toast && (
        <div 
          style={{
            position: 'fixed',
            top: '24px',
            right: '24px',
            zIndex: 99999,
            minWidth: '320px',
            maxWidth: '440px',
            background: 'rgba(28, 20, 24, 0.96)',
            backdropFilter: 'blur(16px)',
            color: '#FFFFFF',
            borderRadius: '16px',
            padding: '16px 20px',
            boxShadow: '0 20px 45px rgba(0,0,0,0.35), 0 0 0 1px rgba(244, 63, 94, 0.3)',
            display: 'flex',
            alignItems: 'flex-start',
            gap: '14px',
            animation: 'toastSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
            fontFamily: 'var(--font-sans)'
          }}
        >
          <div style={{
            width: '36px',
            height: '36px',
            borderRadius: '10px',
            background: toast.type === 'error' ? 'rgba(239, 68, 68, 0.2)' : (toast.type === 'info' ? 'rgba(59, 130, 246, 0.2)' : 'rgba(225, 29, 72, 0.2)'),
            color: toast.type === 'error' ? '#F87171' : (toast.type === 'info' ? '#93C5FD' : '#FDA4AF'),
            display: 'flex',
            alignItems: 'center',
            justifyContent: 'center',
            flexShrink: 0,
            fontSize: '18px'
          }}>
            {toast.type === 'error' ? '⚠️' : (toast.type === 'info' ? 'ℹ️' : '🌸')}
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontWeight: '700', fontSize: '14px', color: '#FFF', marginBottom: '2px', fontFamily: 'var(--font-serif)' }}>
              {toast.title || (toast.type === 'error' ? 'Notice' : 'Blooms&Twirl Notification')}
            </div>
            <div style={{ fontSize: '13px', color: '#E2E8F0', lineHeight: '1.4' }}>
              {toast.message}
            </div>
          </div>
          <button 
            onClick={() => setToast(null)}
            style={{
              background: 'none',
              border: 'none',
              color: '#94A3B8',
              fontSize: '18px',
              cursor: 'pointer',
              padding: '0 4px',
              lineHeight: '1'
            }}
            title="Dismiss notification"
          >
            ×
          </button>
        </div>
      )}
    </div>
  );
}

// Error Boundary to prevent blank screens
class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { hasError: false, error: null };
  }
  static getDerivedStateFromError(error) {
    return { hasError: true, error };
  }
  componentDidCatch(error, errorInfo) {
    console.error("ErrorBoundary caught:", error, errorInfo);
  }
  render() {
    if (this.state.hasError) {
      return (
        <div style={{ padding: '40px', fontFamily: 'sans-serif', textAlign: 'center', background: '#FFF5F8', minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>
          <div style={{ display: 'flex', justifyContent: 'center', marginBottom: '16px', color: '#F70077' }}>
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <path d="M12 7.5a4.5 4.5 0 1 1 4.5 4.5M12 7.5A4.5 4.5 0 1 0 7.5 12M12 7.5V3m4.5 9a4.5 4.5 0 1 1-4.5 4.5M16.5 12H21m-9 4.5a4.5 4.5 0 1 1-4.5-4.5M12 16.5V21m-4.5-9H3"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </div>
          <h2 style={{ color: '#F70077', marginBottom: '8px' }}>Blooms&Twirl Studio Portal Notice</h2>
          <p style={{ color: '#666', maxWidth: '500px', marginBottom: '20px', lineHeight: '1.6' }}>
            {this.state.error?.message || 'A temporary display issue occurred.'}
          </p>
          <button 
            onClick={() => { localStorage.clear(); window.location.reload(); }} 
            style={{ background: '#F70077', color: '#fff', border: 'none', padding: '12px 24px', borderRadius: '9999px', fontWeight: '700', cursor: 'pointer' }}
          >
            Reset & Reload Studio
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

// Mount React Root
const rootElement = document.getElementById('root');
try {
  if (ReactDOM.createRoot) {
    const root = ReactDOM.createRoot(rootElement);
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  } else {
    ReactDOM.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>,
      rootElement
    );
  }
} catch(err) {
  console.error("Mount error:", err);
  rootElement.innerHTML = '<div style="padding:40px;text-align:center;font-family:sans-serif;color:#F70077;"><h2>Studio Launch Error</h2><p>' + err.message + '</p><button onclick="location.reload()" style="padding:10px 20px;background:#F70077;color:#fff;border:none;border-radius:20px;cursor:pointer;">Reload</button></div>';
}
  </script>
</body>
</html>
