const getInitial = (key, fallback) => {
  try {
    const raw = localStorage.getItem('bt_' + key + '_v2');
    return raw ? JSON.parse(raw) : fallback;
  } catch(e) {
    return fallback;
  }
};

const saveItem = (key, data) => {
  try {
    localStorage.setItem('bt_' + key + '_v2', JSON.stringify(data));
  } catch(e) {}
};

              <div className="form-group" style={{ marginBottom: '12px' }}>
                <label style={{ fontSize: '12px', fontWeight: '600' }}>Mobile Phone</label>
                <input type="text" name="phone" className="form-control" required placeholder="+63 917 XXX XXXX" />
              </div>
              <div className="form-group" style={{ marginBottom: '12px' }}>
                <label style={{ fontSize: '12px', fontWeight: '600' }}>Delivery Address</label>
                <input type="text" name="address" className="form-control" required placeholder="e.g. Luna, Apayao or Session Rd, Baguio City" />
              </div>
              <div className="form-group" style={{ marginBottom: '12px' }}>
                <label style={{ fontSize: '12px', fontWeight: '600' }}>Arrangement Name</label>
                <select name="arrangement" className="form-control">
                  {arrangements.map(a => <option key={a.id} value={a.name}>{a.name} (₱{a.price.toLocaleString()})</option>)}
                </select>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginBottom: '16px' }}>
                <div className="form-group">
                  <label style={{ fontSize: '12px', fontWeight: '600' }}>Total (₱)</label>
                  <input type="number" name="total" defaultValue="2450" className="form-control" />
                </div>
                <div className="form-group">
                  <label style={{ fontSize: '12px', fontWeight: '600' }}>Due Time</label>
                  <input type="text" name="dueTime" defaultValue="14:00" className="form-control" />
                </div>
              </div>
              <button type="submit" className="btn-primary" style={{ width: '100%', justifyContent: 'center' }}>
                Save Order to Book
              </button>
            </form>
          </div>
        </div>
      )}

      {/* ========================================================================= */}
      {/* MODAL 2: NEW ARRANGEMENT MODAL */}
      {/* ========================================================================= */}
      {isArrangementModalOpen && (
        <div className="modal-backdrop" onClick={() => setIsArrangementModalOpen(false)}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h3 style={{ margin: 0, fontFamily: 'Fraunces, serif', fontSize: '20px' }}>Add New Floral Design</h3>
              <button onClick={() => setIsArrangementModalOpen(false)} style={{ background: 'none', border: 'none', fontSize: '20px', cursor: 'pointer' }}>×</button>
            </div>
            <form onSubmit={e => {
              e.preventDefault();
              const fd = new FormData(e.target);
              const newArr = {
                id: 'arr-' + Date.now(),
                name: fd.get('name'),
                category: fd.get('category'),
                tag: fd.get('tag') || 'Signature',
                price: Number(fd.get('price')) || 2450,
                coldRoomCount: Number(fd.get('coldRoomCount')) || 10,
                sold30d: 0,
                rating: 5.0,
                image: fd.get('image') || 'https://images.unsplash.com/photo-1561181286-d3fee7d55364?auto=format&fit=crop&w=800&q=80',
                description: fd.get('description') || 'Handcrafted bespoke bouquet with highland blooms.',
                stems: (fd.get('stems') || 'Benguet Roses, Astilbe').split(',').map(s => s.trim()),
                isLowStock: false
              };
              setArrangements([newArr, ...arrangements]);
              setIsArrangementModalOpen(false);
              alert('New bouquet "' + newArr.name + '" added to catalogue!');
            }}>
              <div className="form-group" style={{ marginBottom: '12px' }}>
                <label style={{ fontSize: '12px', fontWeight: '600' }}>Arrangement Name</label>
                <input type="text" name="name" className="form-control" required placeholder="e.g. Velvet Solstice" />
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginBottom: '12px' }}>
                <div className="form-group">
                  <label style={{ fontSize: '12px', fontWeight: '600' }}>Category</label>
                  <select name="category" className="form-control">
                    <option value="Signature">Signature</option>
                    <option value="Statement">Statement</option>
                    <option value="Bridal">Bridal</option>
                    <option value="Dried">Dried</option>
                    <option value="Box">Box</option>
                  </select>
                </div>
                <div className="form-group">
                  <label style={{ fontSize: '12px', fontWeight: '600' }}>Price (₱)</label>
                  <input type="number" name="price" defaultValue="2500" className="form-control" />
                </div>
              </div>
              <div className="form-group" style={{ marginBottom: '12px' }}>
                <label style={{ fontSize: '12px', fontWeight: '600' }}>Key Stems (comma separated)</label>
                <input type="text" name="stems" className="form-control" placeholder="Garden roses, Peonies, Eucalyptus" />
              </div>
              <div className="form-group" style={{ marginBottom: '16px' }}>
                <label style={{ fontSize: '12px', fontWeight: '600' }}>Image URL</label>
                <input type="url" name="image" className="form-control" placeholder="https://..." />
              </div>
              <button type="submit" className="btn-primary" style={{ width: '100%', justifyContent: 'center' }}>
                Publish Arrangement
              </button>
            </form>
          </div>
        </div>
      )}

      {/* ========================================================================= */}
      {/* MODAL 3: NEW INVENTORY ITEM MODAL */}
      {/* ========================================================================= */}
      {isInventoryModalOpen && (
        <div className="modal-backdrop" onClick={() => setIsInventoryModalOpen(false)}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h3 style={{ margin: 0, fontFamily: 'Fraunces, serif', fontSize: '20px' }}>Add Cold Room Stock Line</h3>
              <button onClick={() => setIsInventoryModalOpen(false)} style={{ background: 'none', border: 'none', fontSize: '20px', cursor: 'pointer' }}>×</button>
            </div>
            <form onSubmit={e => {
              e.preventDefault();
              const fd = new FormData(e.target);
              const newItem = {
                id: 'inv-' + Date.now(),
                name: fd.get('name'),
                type: fd.get('type') || 'stem',
                inStock: Number(fd.get('inStock')) || 30,
                needed: Number(fd.get('needed')) || 40,
                unit: fd.get('unit') || 'stems',
                isLow: false
              };
              setInventory([newItem, ...inventory]);
              setIsInventoryModalOpen(false);
              alert('Added ' + newItem.name + ' to cold room inventory!');
            }}>
              <div className="form-group" style={{ marginBottom: '12px' }}>
                <label style={{ fontSize: '12px', fontWeight: '600' }}>Stem / Supply Name</label>
                <input type="text" name="name" className="form-control" required placeholder="e.g. Ranunculus, peach" />
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginBottom: '16px' }}>
                <div className="form-group">
                  <label style={{ fontSize: '12px', fontWeight: '600' }}>Initial In Stock</label>
                  <input type="number" name="inStock" defaultValue="25" className="form-control" />
                </div>
                <div className="form-group">
                  <label style={{ fontSize: '12px', fontWeight: '600' }}>Unit (stems, vases)</label>
                  <input type="text" name="unit" defaultValue="stems" className="form-control" />
                </div>
              </div>
              <button type="submit" className="btn-primary" style={{ width: '100%', justifyContent: 'center' }}>
                Save Stock Line
              </button>
            </form>
          </div>
        </div>
      )}

      {/* ========================================================================= */}
      {/* MODAL 4: NEW PROMO CODE MODAL */}
      {/* ========================================================================= */}
      {isPromoModalOpen && (
        <div className="modal-backdrop" onClick={() => setIsPromoModalOpen(false)}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <h3 style={{ margin: 0, fontFamily: 'Fraunces, serif', fontSize: '20px' }}>Create Promo Code</h3>
              <button onClick={() => setIsPromoModalOpen(false)} style={{ background: 'none', border: 'none', fontSize: '20px', cursor: 'pointer' }}>×</button>
            </div>
            <form onSubmit={e => {
              e.preventDefault();
              const fd = new FormData(e.target);
              const newP = {
                id: 'p-' + Date.now(),
                code: fd.get('code').toUpperCase(),
                description: fd.get('description'),
                discount: fd.get('discount') || '10%',
                status: 'Live',
                usesCount: 0
              };
              setPromotions([newP, ...promotions]);
              setIsPromoModalOpen(false);
              alert('Promo code ' + newP.code + ' is now live!');
            }}>
              <div className="form-group" style={{ marginBottom: '12px' }}>
                <label style={{ fontSize: '12px', fontWeight: '600' }}>Voucher Code</label>
                <input type="text" name="code" className="form-control" required placeholder="e.g. SHAIRASPRING25" />
              </div>
              <div className="form-group" style={{ marginBottom: '12px' }}>
                <label style={{ fontSize: '12px', fontWeight: '600' }}>Discount Value</label>
                <input type="text" name="discount" className="form-control" required placeholder="e.g. 15% or ₱250 OFF" />
              </div>
              <div className="form-group" style={{ marginBottom: '16px' }}>
                <label style={{ fontSize: '12px', fontWeight: '600' }}>Campaign Description</label>
                <input type="text" name="description" className="form-control" required placeholder="Valid for bespoke wedding & birthday bouquets" />
              </div>
              <button type="submit" className="btn-primary" style={{ width: '100%', justifyContent: 'center' }}>
                Activate Voucher Code
              </button>
            </form>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AdminApp />);
  </script>
</body>
</html>
