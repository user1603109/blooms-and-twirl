// --- High-Resolution 50MB Image Engine (IndexedDB + Canvas) ---
const BT_IDB = {
  DB_NAME: 'BT_HighRes_FloralVault',
  STORE_NAME: 'product_images_hd',
  async getDB() {
    if (!window.indexedDB) return null;
    return new Promise((resolve) => {
      const req = indexedDB.open(this.DB_NAME, 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(this.STORE_NAME)) {
          db.createObjectStore(this.STORE_NAME, { keyPath: 'id' });
        }
      };
      req.onsuccess = (e) => resolve(e.target.result);
      req.onerror = () => resolve(null);
    });
  },
  async saveImage(id, dataUrl) {
    try {
      const db = await this.getDB();
      if (!db || !id || !dataUrl) return;
      const tx = db.transaction(this.STORE_NAME, 'readwrite');
      tx.objectStore(this.STORE_NAME).put({ id, dataUrl, timestamp: Date.now() });
    } catch(e) {
      console.warn('IDB saveImage error:', e);
    }
  },
  async getImage(id) {
    try {
      const db = await this.getDB();
      if (!db || !id) return null;
      return new Promise((resolve) => {
        const tx = db.transaction(this.STORE_NAME, 'readonly');
        const req = tx.objectStore(this.STORE_NAME).get(id);
        req.onsuccess = () => resolve(req.result ? req.result.dataUrl : null);
        req.onerror = () => resolve(null);
      });
    } catch(e) {
      return null;
    }
  },
  async deleteImage(id) {
    try {
      const db = await this.getDB();
      if (!db || !id) return;
      const tx = db.transaction(this.STORE_NAME, 'readwrite');
      tx.objectStore(this.STORE_NAME).delete(id);
    } catch(e) {}
  }
};

const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbxng-dNluRmPHqTpf2S14FZHSzIcdvPyuA-0d2fCl5affjBg6UMOLnkVM3SVALGSukb/exec';

    if (prevStamp !== BT_BUILD_STAMP) {

        curSettings.googleAppsScriptUrl = DEFAULT_GAS_URL;
        localStorage.setItem('bt_settings_v2', JSON.stringify(curSettings));
      } catch(e) {}

} catch(e) {}

if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    for (const reg of regs) reg.unregister();
  }).catch(() => {});
}

const getInitial = (key, fallback) => {
  try {
    const raw = localStorage.getItem('bt_' + key + '_v2');
    if (!raw) return fallback;
    const parsed = JSON.parse(raw);
    return parsed !== undefined && parsed !== null ? parsed : fallback;
  } catch(e) {
    console.warn('Error reading bt_' + key + '_v2 from localStorage:', e);
    return fallback;
  }
};

const saveItem = (key, data) => {
  try {
    localStorage.setItem('bt_' + key + '_v2', JSON.stringify(data));
  } catch(e) {
    console.warn('localStorage quota reached. Storing lightweight manifest (HD assets preserved in IndexedDB):', key);
    if (key === 'arrangements' && Array.isArray(data)) {
      try {
        data.forEach(item => {
          if (item.image && item.image.startsWith('data:image')) {
            BT_IDB.saveImage(item.id, item.image);
          }
        });
        const lightweightData = data.map(item => {
          if (item.image && item.image.startsWith('data:image') && item.image.length > 50000) {
            return { ...item, image: 'idb:' + item.id };
          }
          return item;
        });
        localStorage.setItem('bt_' + key + '_v2', JSON.stringify(lightweightData));
      } catch(err2) {
        console.error('Critical quota error saving arrangements:', err2);
      }
    }
  }
};

  // Strict Deduplication Helper to prevent duplicate products and clean up existing clones
  const deduplicateArrangements = (list) => {
    if (!Array.isArray(list)) return [];
    const seenIds = new Set();
    const seenNames = new Set();
    const result = [];
    for (const item of list) {
      if (!item || !item.id) continue;
      const normName = (item.name || '').trim().toLowerCase();
      if (!seenIds.has(item.id) && (!normName || !seenNames.has(normName))) {
        seenIds.add(item.id);
        if (normName) seenNames.add(normName);
        result.push({ ...item });
      } else if (item.isFeatured) {
        // If a duplicate item was marked featured, preserve featured on the master record
        const existing = result.find(r => r.id === item.id || ((r.name || '').trim().toLowerCase() === normName && normName));
        if (existing) {
          existing.isFeatured = true;
        }
      }
    }
    return result;
  };

      const isFeat = Boolean(item.isFeatured) || (Array.isArray(featIds) && featIds.includes(item.id));

  const handleImageFileChange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;

    // 50MB Upload Limit Validation
    const MAX_SIZE_MB = 50;
    const MAX_BYTES = MAX_SIZE_MB * 1024 * 1024;
    if (file.size > MAX_BYTES) {
      showToast(`The selected image is ${(file.size / (1024 * 1024)).toFixed(1)}MB. Maximum allowed upload size is ${MAX_SIZE_MB}MB. Please select a photo up to 50MB.`, 'error', 'Image Size Limit');
      e.target.value = '';
      return;
    }

    const fileSizeFormatted = (file.size / (1024 * 1024)).toFixed(1) + 'MB';
    setImageFileName(`${file.name} (${fileSizeFormatted})`);
    setIsUploadingImage(true);

    const reader = new FileReader();
    reader.onload = (event) => {
      const rawData = event.target.result;
      const img = new Image();
      img.onload = () => {
        try {
          // Full HD 1920px processing with high-detail smoothing (ideal for 50MB high-res flower photography)
          const maxDim = 1920;
          let width = img.width;
          let height = img.height;
          if (width > height && width > maxDim) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else if (height > maxDim) {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, width, height);

          // Premium 0.88 high-definition quality
          const ultraQualityData = canvas.toDataURL('image/jpeg', 0.88);
          setNewArrangementImage(ultraQualityData);
        } catch(err) {
          setNewArrangementImage(rawData);
        } finally {
          setIsUploadingImage(false);
        }
      };
      img.onerror = () => {
        setNewArrangementImage(rawData);
        setIsUploadingImage(false);
      };
      img.src = rawData;
    };
    reader.onerror = () => {
      showToast('Error reading high-resolution image. Please try again.', 'error', 'Upload Error');
      setIsUploadingImage(false);
    };
    reader.readAsDataURL(file);
  };

          if (inv.linkedFlowerId === arrId || (inv.name && a.name && inv.name.toLowerCase().includes(a.name.toLowerCase().split(' ')[0]))) {
            const updatedInv = inv.inStock + delta;
            return { ...inv, inStock: updatedInv, isLow: updatedInv < inv.needed };
          }
          return inv;
        }));
        return { ...a, coldRoomCount: nextStock, isLowStock: nextStock <= 5 };
      }
      return a;
    }));
  };

  const handleCheckInInventory = (item, delta) => {
    const newCount = item.inStock + delta;
    setInventory(inventory.map(i => i.id === item.id ? { ...i, inStock: newCount, isLow: newCount < i.needed } : i));
    if (item.linkedFlowerId) {
      setArrangements(prev => prev.map(a => a.id === item.linkedFlowerId ? { ...a, coldRoomCount: a.coldRoomCount + delta } : a));

    showToast('Checked in +' + delta + ' units for ' + item.name + '. Connected catalogue stock synchronized!', 'success', 'Inventory Restocked');
  };

  // Delivery Stage Advance Action across Sub-Statuses
  const getNextDeliveryStage = (current) => {
    const norm = normalizeSubStatus(current);
    const progression = [
      'To Pick',
      'Packing',
      'Ready to Ship',
      'Handed to Courier',
      'In Hub Transit',
      'Out for Delivery',
      'Delivered',
      'Received by Customer'
    ];
    const idx = progression.indexOf(norm);
    if (idx >= 0 && idx < progression.length - 1) {
      return progression[idx + 1];
    }
    return current;
  };

  const advanceOrderStatus = (orderId, newStatus) => {
    const target = orders.find(o => o.id === orderId);
    const updated = orders.map(o => o.id === orderId ? { ...o, status: newStatus } : o);
    setOrders(updated);
    saveItem('orders', updated);

    // Sync to Supabase Realtime so customer's mobile phone updates in real time!
    if (window.SupabaseService && window.SupabaseService.isConfigured()) {
      window.SupabaseService.updateOrderStatus(orderId, newStatus);
    }

    const norm = normalizeSubStatus(newStatus);
    if (['Delivered', 'Received by Customer'].includes(norm) && target) {
      showToast(`✉️ Delivery confirmed! Automatic success email and review invitation sent to ${target.customerName} (${target.email || 'customer@ph.com'})!`, 'success', 'Delivery Success Emailed');

    const rows = orders.map(o => [

      `"${(o.customerName || '').replace(/"/g, '""')}"`,
      `"${o.phone || ''}"`,
      `"${(o.address || '').replace(/"/g, '""')}"`,
      `"${(o.arrangementName || '').replace(/"/g, '""')}"`,
      o.itemType || 'arranged',
      o.channel || 'Online',
      o.total || 0,
      o.payment || 'GCash',
      o.courier || 'Jom',
      `"${normalizeSubStatus(o.status)}"`
    ]);
    const csvContent = 'data:text/csv;charset=utf-8,' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement('a');
    link.setAttribute('href', encodedUri);
    link.setAttribute('download', `Blooms_Twirl_Studio_Ledger_${new Date().toISOString().slice(0,10)}.csv`);

      if (orderSubStatusFilter !== 'all' && norm !== orderSubStatusFilter) {

                  <select name="status" className="form-control" style={{ padding: '7px 10px', fontSize: '13px' }}>
                    {ALL_SUB_STATUSES.map(stage => (
                      <option key={stage} value={stage}>{stage}</option>
                    ))}
                  </select>
                </div>
                <div className="form-group" style={{ marginBottom: 0 }}>
                  <label style={{ fontSize: '11px', fontWeight: '700', textTransform: 'uppercase', letterSpacing: '0.4px', color: 'var(--text-muted)' }}>Courier</label>
                  <select name="courier" className="form-control" style={{ padding: '7px 10px', fontSize: '13px' }}>
                    <option value="Jom">Jom (Apayao Van)</option>
                    <option value="Nino">Nino (Motorcycle Express)</option>
                    <option value="Marisol">Marisol (Baguio Logistics)</option>
                    <option value="LBC">LBC Express</option>
                    <option value="Unassigned">Unassigned</option>
                  </select>
                </div>
                <div className="form-group" style={{ marginBottom: 0 }}>
                  <label style={{ fontSize: '11px', fontWeight: '700', textTransform: 'uppercase', letterSpacing: '0.4px', color: 'var(--text-muted)' }}>Due Time</label>
                  <input type="text" name="dueTime" defaultValue="14:00" className="form-control" style={{ padding: '7px 10px', fontSize: '13px' }} />
                </div>
                <div className="form-group" style={{ marginBottom: 0 }}>
                  <label style={{ fontSize: '11px', fontWeight: '700', textTransform: 'uppercase', letterSpacing: '0.4px', color: 'var(--text-muted)' }}>Dedication Message (Optional)</label>
                  <input type="text" name="cardMessage" className="form-control" placeholder="Handwritten card note..." style={{ padding: '7px 10px', fontSize: '13px' }} />
                </div>
              </div>

              {/* Action Buttons Row */}
              <div style={{ display: 'flex', gap: '10px', justifyContent: 'flex-end', paddingTop: '4px' }}>
                <button 
                  type="button" 
                  className="btn-secondary" 
                  onClick={() => setIsNewOrderModalOpen(false)}
                  style={{ padding: '9px 18px', fontSize: '13px' }}
                >
                  Cancel
                </button>
                <button 
                  type="submit" 
                  className="btn-primary" 
                  style={{ padding: '9px 24px', fontSize: '13px', display: 'inline-flex', alignItems: 'center', gap: '6px' }}
                >
                  <Icons.Plus /> Confirm & Record Order
                </button>
              </div>
            </form>
          </div>
        </div>
      )}

      {/* ========================================================================= */}
      {/* MODAL: MANAGE FLOWER FAMILIES (ADD, EDIT, DELETE)                          */}
      {/* ========================================================================= */}
      {isFamilyManagerOpen && (
        <div className="modal-backdrop" onClick={() => { setIsFamilyManagerOpen(false); setEditingFamily(null); }}>
          <div className="modal-card" style={{ maxWidth: '520px' }} onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div>
                <h3 style={{ margin: 0, fontFamily: 'Fraunces, serif', fontSize: '20px' }}>Manage Flower Families</h3>
                <div style={{ fontSize: '12px', color: 'var(--text-muted)' }}>Add, edit, or delete botanical families for loose stem classification.</div>
              </div>
              <button onClick={() => { setIsFamilyManagerOpen(false); setEditingFamily(null); }} style={{ background: 'none', border: 'none', fontSize: '20px', cursor: 'pointer' }}>×</button>
            </div>

            {/* Add New Family Input Form */}
            <form onSubmit={(e) => { e.preventDefault(); handleAddFamily(newFamilyInput); }} style={{ display: 'flex', gap: '8px', marginBottom: '20px' }}>
              <input 
                type="text" 
                className="form-control" 
                placeholder="e.g. Carnations, Baby's Breath, Tulips..."
                value={newFamilyInput}
                onChange={e => setNewFamilyInput(e.target.value)}
                style={{ flex: 1 }}
              />
              <button type="submit" className="btn-primary" style={{ whiteSpace: 'nowrap' }}>
                <Icons.Plus /> Add Family
              </button>
            </form>

            {/* Family List with Edit & Delete */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', maxHeight: '360px', overflowY: 'auto' }}>
              {flowerFamilies.map(fam => {
                const count = arrangements.filter(a => a.category === fam && a.productType === 'flowers_only').length;
                const isEditingThis = editingFamily === fam;

                return (
                  <div key={fam} style={{
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'space-between',
                    padding: '10px 14px',
                    borderRadius: '12px',
                    background: '#FDF7F9',
                    border: '1px solid var(--border-light)'
                  }}>
                    {isEditingThis ? (
                      <div style={{ display: 'flex', alignItems: 'center', gap: '8px', flex: 1, marginRight: '8px' }}>
                        <input 
                          type="text" 
                          className="form-control" 
                          value={editingFamilyNewName} 
                          onChange={e => setEditingFamilyNewName(e.target.value)} 
                          autoFocus
                          style={{ padding: '4px 8px', fontSize: '13px' }}
                        />
                        <button 
                          type="button" 
                          className="btn-primary" 
                          style={{ padding: '4px 10px', fontSize: '12px' }}
                          onClick={() => handleSaveEditFamily(fam)}
                        >
                          Save
                        </button>
                        <button 
                          type="button" 
                          className="btn-secondary" 
                          style={{ padding: '4px 8px', fontSize: '12px' }}
                          onClick={() => setEditingFamily(null)}
                        >
                          Cancel
                        </button>
                      </div>
                    ) : (
                      <>
                        <div>
                          <span style={{ fontWeight: '700', fontSize: '14px', color: 'var(--text-main)' }}>{fam}</span>
                          <span style={{ fontSize: '12px', color: 'var(--text-muted)', marginLeft: '8px' }}>
                            ({count} {count === 1 ? 'variety' : 'varieties'})
                          </span>
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                          <button 
                            type="button" 
                            className="btn-secondary" 
                            style={{ padding: '4px 8px', fontSize: '11px', display: 'inline-flex', alignItems: 'center', gap: '4px' }}
                            onClick={() => {
                              setEditingFamily(fam);
                              setEditingFamilyNewName(fam);
                            }}
                          >
                            <Icons.Edit /> Edit
                          </button>
                          <button 
                            type="button" 
                            className="btn-secondary" 
                            style={{ padding: '4px 8px', fontSize: '11px', color: '#E11D48', borderColor: '#FECDD3', background: '#FFF1F2' }}
                            title="Delete this family"
                            onClick={() => handleDeleteFamily(fam)}
                          >
                            <Icons.Trash />
                          </button>
                        </div>
                      </>
                    )}
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      )}

      {/* ========================================================================= */}
      {/* MODAL 2: ADD / EDIT ARRANGEMENT OR LOOSE FLOWER MODAL                     */}
      {/* ========================================================================= */}
      {isArrangementModalOpen && (
        <div className="modal-backdrop" onClick={() => { setIsArrangementModalOpen(false); setEditingArrangement(null); setNewArrangementImage(''); setImageFileName(''); }}>
          <div className="modal-card" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div>
                <h3 style={{ margin: 0, fontFamily: 'Fraunces, serif', fontSize: '20px' }}>
                  {editingArrangement 
                    ? (`Edit ${modalProductType === 'flowers_only' ? 'Flower Variety' : 'Arrangement'}: ${editingArrangement.name}`) 
                    : (`Add New ${modalProductType === 'flowers_only' ? 'Flower Variety (Stems Only)' : 'Floral Design'}`)
                  }
                </h3>
                <span style={{ fontSize: '12px', color: 'var(--text-muted)' }}>
                  {modalProductType === 'flowers_only' ? 'Fresh cut highland stems sold without arrangement' : 'Hand-crafted styled bouquet or arrangement'}
                </span>
              </div>
              <button onClick={() => { setIsArrangementModalOpen(false); setEditingArrangement(null); setNewArrangementImage(''); setImageFileName(''); }} style={{ background: 'none', border: 'none', fontSize: '20px', cursor: 'pointer' }}>×</button>
            </div>

            {/* Type selector toggle inside modal */}
            <div style={{ display: 'flex', gap: '8px', background: '#F8DFE5', padding: '4px', borderRadius: '12px', marginBottom: '18px' }}>
              <button
                type="button"
                onClick={() => setModalProductType('arranged')}
                style={{
                  flex: 1,
                  padding: '8px',
                  borderRadius: '9px',
                  border: 'none',
                  background: modalProductType === 'arranged' ? '#FFFFFF' : 'transparent',
                  color: modalProductType === 'arranged' ? 'var(--primary)' : 'var(--text-muted)',
                  fontWeight: '700',
                  fontSize: '13px',
                  cursor: 'pointer',
                  boxShadow: modalProductType === 'arranged' ? '0 2px 6px rgba(0,0,0,0.08)' : 'none'
                }}
              >
                Arranged Product
              </button>
              <button
                type="button"
                onClick={() => setModalProductType('flowers_only')}
                style={{
                  flex: 1,
                  padding: '8px',
                  borderRadius: '9px',
                  border: 'none',
                  background: modalProductType === 'flowers_only' ? '#FFFFFF' : 'transparent',
                  color: modalProductType === 'flowers_only' ? 'var(--primary)' : 'var(--text-muted)',
                  fontWeight: '700',
                  fontSize: '13px',
                  cursor: 'pointer',
                  boxShadow: modalProductType === 'flowers_only' ? '0 2px 6px rgba(0,0,0,0.08)' : 'none'
                }}
              >
                Flowers Only (Unarranged)
              </button>
            </div>

            <form key={(editingArrangement ? editingArrangement.id : 'new-item') + '-' + modalProductType} onSubmit={async (e) => {
              e.preventDefault();
              if (isSubmittingArrangement) return;
              setIsSubmittingArrangement(true);

              try {
                const fd = new FormData(e.target);
                const productName = (fd.get('name') || (editingArrangement ? editingArrangement.name : (modalProductType === 'flowers_only' ? 'Fresh Flower Stems' : 'Artisanal Bouquet'))).trim();
                let finalImageUrl = newArrangementImage || (editingArrangement ? editingArrangement.image : 'https://images.unsplash.com/photo-1587556930799-8dca6a737e5e?auto=format&fit=crop&w=800&q=80');
                
                const stockCount = Number(fd.get('coldRoomCount')) || (editingArrangement ? editingArrangement.coldRoomCount : (modalProductType === 'flowers_only' ? 50 : 10));
                const stemsList = (fd.get('stems') || '').split(',').map(s => s.trim()).filter(Boolean);
                const unitVal = fd.get('unit') || (modalProductType === 'flowers_only' ? 'per stem' : '');
                const isFeaturedVal = fd.get('isFeatured') === 'on' || fd.get('isFeatured') === 'true';

                // Determine targetId once (preserving existing ID if editing or match found)
                const existingMatch = !editingArrangement && arrangements.find(a => (a.name || '').trim().toLowerCase() === productName.toLowerCase());
                let targetId = editingArrangement ? editingArrangement.id : (existingMatch ? existingMatch.id : ((modalProductType === 'flowers_only' ? 'flw-' : 'arr-') + Date.now()));

                // Auto-cleanup and deterministic upload to Supabase Storage:
                // Replaces in-place to prevent database flooding and purges previous custom photo if replaced
                if (newArrangementImage && window.SupabaseService && window.SupabaseService.isConfigured()) {
                  if (editingArrangement && editingArrangement.image && editingArrangement.image.includes('/bouquet-images/')) {
                    await window.SupabaseService.deleteBouquetImage(editingArrangement.image);
                  }
                  const cdnUrl = await window.SupabaseService.uploadBouquetImage(newArrangementImage, productName, targetId);
                  if (cdnUrl) finalImageUrl = cdnUrl;
                }

                const existingItem = editingArrangement || existingMatch;
                const arrangementRecord = {
                  id: targetId,
                  productType: modalProductType,
                  name: productName,
                  category: fd.get('category') || (existingItem ? existingItem.category : (modalProductType === 'flowers_only' ? 'Roses' : 'Signature')),
                  tag: fd.get('tag') || (existingItem ? existingItem.tag : (modalProductType === 'flowers_only' ? 'Fresh Cut' : 'Signature')),
                  price: Number(fd.get('price')) || (modalProductType === 'flowers_only' ? 85 : 2450),
                  unit: unitVal,
                  coldRoomCount: stockCount,
                  sold30d: existingItem ? (existingItem.sold30d || 0) : 0,
                  rating: existingItem ? (existingItem.rating || 5.0) : 5.0,
                  image: finalImageUrl,
                  description: fd.get('description') || (modalProductType === 'flowers_only' ? 'Freshly harvested highland stems from Baguio City.' : 'Handcrafted bespoke bouquet with highland blooms.'),
                  stems: stemsList.length > 0 ? stemsList : (modalProductType === 'flowers_only' ? [productName] : ['Benguet Roses', 'Astilbe']),
                  isLowStock: stockCount <= (modalProductType === 'flowers_only' ? 20 : 5),
                  isFeatured: isFeaturedVal
                };

                let updated;
                if (existingItem) {
                  updated = deduplicateArrangements(arrangements.map(a => a.id === targetId ? arrangementRecord : a));
                  showToast(`"${productName}" updated successfully in floral catalogue!`, 'success', 'Catalogue Updated');
                } else {
                  updated = deduplicateArrangements([arrangementRecord, ...arrangements]);
                  showToast(`New ${modalProductType === 'flowers_only' ? 'flower variety' : 'bouquet'} "${arrangementRecord.name}" published!`, 'success', 'Published');
                }

                setArrangements(updated);
                saveItem('arrangements', updated);
                const featuredIds = updated.filter(a => Boolean(a.isFeatured)).map(a => a.id);
                saveItem('featured_arrangement_ids', featuredIds);
                if (finalImageUrl) BT_IDB.saveImage(targetId, finalImageUrl);

                // Sync directly to Supabase Cloud Database in real time (for BOTH new and edited items!)
                if (window.SupabaseService && window.SupabaseService.isConfigured()) {
                  await window.SupabaseService.upsertArrangement(arrangementRecord);
                }

                setIsArrangementModalOpen(false);
                setEditingArrangement(null);
                setNewArrangementImage('');
                setImageFileName('');
              } finally {
                setIsSubmittingArrangement(false);
              }
            }}>
              <div className="form-group" style={{ marginBottom: '12px' }}>
                <label style={{ fontSize: '12px', fontWeight: '600' }}>
                  {modalProductType === 'flowers_only' ? 'Flower Variety / Stem Name' : 'Arrangement Name'}
                </label>
                <input 
                  type="text" 
                  name="name" 
                  className="form-control" 
                  required 
                  defaultValue={editingArrangement ? editingArrangement.name : ''} 
                  placeholder={modalProductType === 'flowers_only' ? 'e.g. Benguet Highland Red Rose' : 'e.g. Velvet Solstice'} 
                />
              </div>

              {/* Arranged Products Specific Inputs */}
              {modalProductType === 'arranged' && (
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '10px', marginBottom: '12px' }}>
                  <div className="form-group">
                    <label style={{ fontSize: '12px', fontWeight: '600' }}>Design Category</label>
                    <select name="category" defaultValue={editingArrangement ? editingArrangement.category : 'Signature'} className="form-control">
                      <option value="Signature">Signature</option>
                      <option value="Statement">Statement</option>
                      <option value="Bridal">Bridal</option>
                      <option value="Dried">Dried</option>
                      <option value="Box">Box</option>
                      <option value="Houseplant">Houseplant</option>
                    </select>
                  </div>
                  <div className="form-group">
                    <label style={{ fontSize: '12px', fontWeight: '600' }}>Price (₱)</label>
                    <input type="number" name="price" defaultValue={editingArrangement ? editingArrangement.price : 2500} className="form-control" />
                  </div>
                  <div className="form-group">
                    <label style={{ fontSize: '12px', fontWeight: '600' }}>Cold Room Ready</label>
                    <input type="number" name="coldRoomCount" defaultValue={editingArrangement ? editingArrangement.coldRoomCount : 10} className="form-control" />
                  </div>
                </div>
              )}

              {/* Flowers Only Specific Inputs */}
              {modalProductType === 'flowers_only' && (
                <div style={{ display: 'grid', gridTemplateColumns: '1.2fr 1fr 1fr', gap: '10px', marginBottom: '12px' }}>
                  <div className="form-group">
                    <label style={{ fontSize: '12px', fontWeight: '600' }}>Flower Family</label>
                    <select name="category" defaultValue={editingArrangement ? editingArrangement.category : 'Roses'} className="form-control">
                      <option value="Roses">Roses</option>
                      <option value="Peonies">Peonies</option>
                      <option value="Ranunculus">Ranunculus</option>
                      <option value="Hydrangeas">Hydrangeas</option>
                      <option value="Sunflowers">Sunflowers</option>
                      <option value="Tulips">Tulips</option>
                      <option value="Orchids">Orchids</option>
                      <option value="Foliage">Foliage / Greenery</option>
                    </select>
                  </div>
                  <div className="form-group">
                    <label style={{ fontSize: '12px', fontWeight: '600' }}>Price (₱)</label>
                    <input type="number" name="price" defaultValue={editingArrangement ? editingArrangement.price : 85} className="form-control" />
                  </div>
                  <div className="form-group">
                    <label style={{ fontSize: '12px', fontWeight: '600' }}>Pricing Unit</label>
                    <select name="unit" defaultValue={editingArrangement ? (editingArrangement.unit || 'per stem') : 'per stem'} className="form-control">
                      <option value="per stem">per stem</option>
                      <option value="per dozen">per dozen</option>
                      <option value="per bunch (10 stems)">per bunch (10 stems)</option>
                      <option value="per bunch (5 stems)">per bunch (5 stems)</option>
                    </select>
                  </div>
                </div>
              )}

              {modalProductType === 'flowers_only' ? (
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginBottom: '12px' }}>
                  <div className="form-group">
                    <label style={{ fontSize: '12px', fontWeight: '600' }}>Stems in Cold Bucket</label>
                    <input type="number" name="coldRoomCount" defaultValue={editingArrangement ? editingArrangement.coldRoomCount : 50} className="form-control" />
                  </div>
                  <div className="form-group">
                    <label style={{ fontSize: '12px', fontWeight: '600' }}>Stock Badge / Tag</label>
                    <input type="text" name="tag" defaultValue={editingArrangement ? (editingArrangement.tag || 'Fresh Cut') : 'Fresh Cut'} className="form-control" placeholder="e.g. Fresh Cut, Wholesale" />
                  </div>
                </div>
              ) : (
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px', marginBottom: '12px' }}>
                  <div className="form-group">
                    <label style={{ fontSize: '12px', fontWeight: '600' }}>Key Stems Included</label>
                    <input type="text" name="stems" defaultValue={editingArrangement ? (editingArrangement.stems ? editingArrangement.stems.join(', ') : '') : ''} className="form-control" placeholder="Garden roses, Peonies, Eucalyptus" />
                  </div>
                  <div className="form-group">
                    <label style={{ fontSize: '12px', fontWeight: '600' }}>Display Tag / Badge</label>
                    <input type="text" name="tag" defaultValue={editingArrangement ? (editingArrangement.tag || 'Signature') : 'Signature'} className="form-control" placeholder="e.g. Signature, Best Seller" />
                  </div>
                </div>
              )}

              <div className="form-group" style={{ marginBottom: '14px' }}>
                <label style={{ fontSize: '12px', fontWeight: '600' }}>
                  {modalProductType === 'flowers_only' ? 'Harvest Notes / Origin / Care' : 'Arrangement Description'}
                </label>
                <textarea 
                  name="description" 
                  rows="2" 
                  defaultValue={editingArrangement ? (editingArrangement.description || '') : ''} 
                  className="form-control" 
                  placeholder={modalProductType === 'flowers_only' ? 'Harvested daily from Baguio mountain terraces. Keep submerged in fresh cold water...' : 'Handcrafted bespoke bouquet with highland blooms...'} 
                />
              </div>

              {/* Feature on Public Landing Page Switch */}
              <div style={{
                background: '#FFF0F5',
                border: '1.5px dashed var(--primary-border)',
                borderRadius: '12px',
                padding: '12px 14px',
                marginBottom: '16px',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'space-between',
                gap: '12px'
              }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                  <div style={{
                    width: '32px',
                    height: '32px',
                    borderRadius: '8px',
                    background: 'linear-gradient(135deg, #F70077 0%, #D10056 100%)',
                    color: '#fff',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    fontSize: '15px'
                  }}>
                    ★
                  </div>
                  <div>
                    <div style={{ fontSize: '13px', fontWeight: '700', color: 'var(--text-main)' }}>
                      Feature on Landing Page
                    </div>
                    <div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>
                      Display this creation in the public storefront's "Featured Creations" section
                    </div>
                  </div>
                </div>
                <label style={{ display: 'flex', alignItems: 'center', cursor: 'pointer', margin: 0 }}>
                  <input 
                    type="checkbox" 
                    name="isFeatured" 
                    defaultChecked={editingArrangement ? Boolean(editingArrangement.isFeatured) : false} 
                    style={{ width: '18px', height: '18px', accentColor: 'var(--primary)', cursor: 'pointer' }}
                  />
                </label>
              </div>

              {/* Upload Image & Live Preview (Product-Images in GDrive) */}
              <div className="form-group" style={{ marginBottom: '18px' }}>
                <label style={{ fontSize: '12px', fontWeight: '600', display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '6px' }}>
                  <span>Upload Product Image</span>
                  <span style={{ fontSize: '11px', color: '#059669', fontWeight: '700' }}>⚡ Supabase Cloud CDN (bouquet-images)</span>
                </label>

                <input 
                  type="file" 
                  accept="image/*"
                  id="arrangement-image-upload-input"
                  style={{ display: 'none' }}
                  onChange={handleImageFileChange}
                />

                <div 
                  onClick={() => document.getElementById('arrangement-image-upload-input').click()}
                  style={{
                    border: '2px dashed var(--primary-border)',
                    borderRadius: '14px',
                    padding: '16px 14px',
                    textAlign: 'center',
                    cursor: 'pointer',
                    background: '#FFF8FA',
                    transition: 'all 0.2s ease',
                    marginBottom: '10px'
                  }}
                >
                  <div style={{ color: 'var(--primary)', marginBottom: '4px' }}>
                    <Icons.Flower />
                  </div>
                  <div style={{ fontSize: '13px', fontWeight: '700', color: isUploadingImage ? 'var(--primary)' : 'var(--text-main)' }}>
                    {isUploadingImage 
                      ? 'Processing photo...' 
                      : (imageFileName ? imageFileName : (newArrangementImage ? 'Click to Change Uploaded Photo' : 'Click to Browse & Upload Photo'))}
                  </div>
                  <div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>
                    {isUploadingImage ? 'Optimizing photo for display...' : 'Select flower photo from your phone or computer'}
                  </div>
                </div>

                {/* Live Preview of the Product While Being Created / Edited */}
                {newArrangementImage && (
                  <div style={{ borderRadius: '14px', overflow: 'hidden', border: '1px solid var(--border-light)', position: 'relative', marginTop: '10px', background: '#FFFFFF', boxShadow: '0 4px 12px rgba(247,0,119,0.08)' }}>
                    <div style={{ position: 'absolute', top: '8px', left: '8px', background: 'rgba(36,24,28,0.85)', color: '#fff', fontSize: '10px', fontWeight: '800', letterSpacing: '0.6px', padding: '3px 8px', borderRadius: '6px', backdropFilter: 'blur(4px)' }}>
                      LIVE PRODUCT PREVIEW
                    </div>
                    <img 
                      src={newArrangementImage} 
                      alt="Floral Preview" 
                      style={{ width: '100%', height: '190px', objectFit: 'cover', display: 'block' }} 
                    />
                    <div style={{ padding: '10px 14px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', background: '#FFF9FB', borderTop: '1px solid var(--border-subtle)' }}>
                      <span style={{ fontSize: '12px', fontWeight: '600', color: 'var(--text-main)' }}>
                        Previewing product image
                      </span>
                      <button 
                        type="button" 
                        onClick={() => { setNewArrangementImage(''); setImageFileName(''); }} 
                        style={{ background: 'none', border: 'none', color: '#E11D48', fontSize: '11px', fontWeight: '700', cursor: 'pointer' }}
                      >
                        Remove
                      </button>
                    </div>
                  </div>

            onClick={() => setToast(null)}
            style={{
              background: 'none',
              border: 'none',
              color: '#94A3B8',
              fontSize: '18px',
              cursor: 'pointer',
              padding: '0 4px',
              lineHeight: '1'
            }}
            title="Dismiss notification"
          >
            ×
          </button>
        </div>
      )}

      {/* ========================================================================= */}
      {/* DEDICATED IN-APP CONFIRMATION MODAL (ZERO BROWSER DIALOGS)                */}
      {/* ========================================================================= */}
      {confirmModal && (
        <div 
          className="modal-backdrop" 
          style={{ zIndex: 99998 }}
          onClick={() => setConfirmModal(null)}
        >
          <div 
            className="modal-card" 
            style={{ 
              maxWidth: '460px', 
              padding: '28px', 
              borderRadius: '20px', 
              border: '1px solid #FFE4E6',
              boxShadow: '0 25px 60px rgba(0,0,0,0.25)',
              textAlign: 'center'
            }}
            onClick={e => e.stopPropagation()}
          >
            <div style={{
              width: '56px',
              height: '56px',
              borderRadius: '50%',
              background: confirmModal.isDestructive ? '#FFF1F2' : '#FDF2F8',
              color: confirmModal.isDestructive ? '#E11D48' : '#DB2777',
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
              fontSize: '24px',
              margin: '0 auto 16px auto',
              border: confirmModal.isDestructive ? '2px solid #FECDD3' : '2px solid #FBCFE8'
            }}>
              {confirmModal.isDestructive ? '🗑️' : '✨'}
            </div>
            <h3 style={{ 
              fontFamily: 'var(--font-serif)', 
              fontSize: '20px', 
              fontWeight: '700', 
              color: 'var(--text-main)', 
              margin: '0 0 10px 0' 
            }}>
              {confirmModal.title}
            </h3>
            <p style={{ 
              fontSize: '14px', 
              color: 'var(--text-muted)', 
              lineHeight: '1.5', 
              margin: '0 0 24px 0' 
            }}>
              {confirmModal.message}
            </p>
            <div style={{ display: 'flex', gap: '12px', justifyContent: 'center' }}>
              <button 
                type="button"
                className="btn-secondary" 
                style={{ flex: 1, padding: '10px 18px', justifyContent: 'center', fontSize: '14px' }}
                onClick={() => setConfirmModal(null)}
              >
                {confirmModal.cancelText || 'Cancel'}
              </button>
              <button 
                type="button"
                className="btn-primary" 
                style={{ 
                  flex: 1, 
                  padding: '10px 18px', 
                  justifyContent: 'center', 
                  fontSize: '14px',
                  background: confirmModal.isDestructive ? '#E11D48' : undefined,
                  borderColor: confirmModal.isDestructive ? '#BE123C' : undefined
                }}
                onClick={confirmModal.onConfirm}
              >
                {confirmModal.confirmText || 'Confirm'}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AdminApp />);
  </script>
</body>
</html>
